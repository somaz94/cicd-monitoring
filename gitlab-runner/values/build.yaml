## The ubuntu runner image uses a different UID: switch securityContext with it.
image:
  registry: registry.gitlab.com
  image: gitlab-org/gitlab-runner
  # tag: alpine-v{{.Chart.AppVersion}}

replicas: 3

revisionHistoryLimit: 5

gitlabUrl: http://gitlab.example.com/

runnerToken: "<GITLAB_RUNNER_TOKEN>"

## Lowered from 10 to 5 (2026-05-08) to relieve etcd/apiserver write pressure under CI bursts.
## Lowered from 5 to 3 (2026-05-14) after a single UPGRADE_MODE=tier2 trigger created
## 7 auto-MRs simultaneously and saturated compute-04 (4-core ci-build node) at 117% CPU.
## With 3 controller replicas × concurrent 3 = 9 total build-image slots (was 15),
## resource_group on validate:upgrade_mr already serializes the heavy `make lint` work.
concurrent: 3

shutdown_timeout: 0

checkInterval: 3

rbac:
  create: true
  generatedServiceAccountName: ""

  rules:
    - apiGroups: ["extensions", "apps"]
      resources: ["deployments"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: [""]
      resources: ["pods","services","secrets","pods/exec", "serviceaccounts", "pods/attach"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  podSecurityPolicy:
    enabled: true
    resourceNames:
      - gitlab-runner

  imagePullSecrets: []

serviceAccount:
  create: true

runners:
  # `request_concurrency` below is a CEILING, not the limit that is actually enforced. Runner 19.x
  # also computes an adaptive request-concurrency limit and enforces the LOWER of the two, and on
  # this fleet the adaptive one measured lower — so raising the number below does not by itself
  # widen poll concurrency, and a burst can still serialize. Live figures and the full analysis sit
  # next to the GitLabRunnerConcurrentLimitReached rule in
  # observability/monitoring/kube-prometheus-stack/values/dev-alerts-apps.yaml; that alert used to
  # be justified by this setting and no longer reads the request-concurrency counter at all.
  # This note lives ABOVE `config:` on purpose: comments inside the block are literal TOML, so they
  # land in the rendered ConfigMap and every edit rolls the runner managers. Out here they are free.
  config: |
    [[runners]]
      # Ceiling only, NOT the limit actually enforced — see the note above `config:`. Kept just
      # below `concurrent` (request_concurrency must not exceed the run capacity). Must sit above
      # the [runners.kubernetes] sub-table header (TOML binds keys to the last table).
      request_concurrency = 2
      [runners.kubernetes]
        namespace = "{{.Release.Namespace}}"
        image = "alpine"
        # Reduce apiserver GET /pods polling frequency (default 3s) — eases control-plane load.
        poll_interval = 5
        # Tolerate transient apiserver slowdowns without failing the job (default 180s).
        poll_timeout = 600
        # Allow graceful pod termination instead of immediate delete (reduces etcd churn).
        cleanup_grace_period_seconds = 30
        # Resource requests/limits for the transient CI job pods. These keys belong to
        # the [runners.kubernetes] table, so they MUST stay above the node_selector /
        # node_tolerations sub-table headers below (TOML would otherwise bind them to the
        # last-opened sub-table). Sized from the 7d Prometheus peaks on the FIXED single
        # ci-build node k8s-compute-04 (~14.7Gi/3.4cpu allocatable, no autoscale):
        #   build peak ~2.65Gi mem / 0.69 cpu, helper peak ~242Mi, observed peak
        #   concurrency ~9-10 across the 3 controller replicas but with only ~5.6Gi total
        #   at that moment (many light jobs, rarely a heavy build). memory_request=1Gi lets
        #   all ~9 slots schedule (9Gi < 14.7Gi) while the real footprint leaves ample
        #   headroom; memory_limit=3.5Gi caps a heavy build above its 2.65Gi peak.
        #   cpu_request=300m matches the observed per-pod average so CPU does not throttle
        #   scheduling on the 3.4-core node.
        cpu_request = "300m"
        cpu_limit = "2"
        memory_request = "1Gi"
        memory_limit = "3.5Gi"
        helper_cpu_request = "100m"
        helper_cpu_limit = "500m"
        helper_memory_request = "128Mi"
        helper_memory_limit = "512Mi"
        # service_* applies ONLY to jobs that declare a `services:` container — here the
        # docker:dind of the gitlab-toolchain-images build_custom (buildx multi-arch) job.
        # No dind job ran in the 7d sample window, so these are a defensive ESTIMATE, not a
        # measurement: they cap the one uncapped OOM vector on this fixed node (an unbounded
        # dind builder). Revisit with `kubectl top pod` the next time a build_custom job runs.
        service_cpu_request = "250m"
        service_cpu_limit = "2"
        service_memory_request = "512Mi"
        service_memory_limit = "3Gi"
        # Pin build pods to k8s-compute-04 (tainted with dedicated=ci-build:NoSchedule + labeled role=ci-build)
        # to isolate buildx/dind disk IO from compute-01/02/03. Deploy runners deliberately omit these so
        # the same NoSchedule taint keeps them on the other nodes.
        [runners.kubernetes.node_selector]
          "role" = "ci-build"
        # Toleration table key uses "<taint-key>=<taint-value>" with the effect as the value.
        # taint dedicated=ci-build:NoSchedule -> "dedicated=ci-build" = "NoSchedule".
        [runners.kubernetes.node_tolerations]
          "dedicated=ci-build" = "NoSchedule"
        # Run service containers (e.g. docker:dind) as privileged so dockerd can mount cgroups.
        # build container itself stays unprivileged (limits build-script blast radius).
        # Required by gitlab-toolchain-images build_custom job (docker buildx multi-arch).
        # Note: top-level `services_privileged` is dropped by `register --template-config`
        # in GitLab Runner 18.11.x. Use the nested security_context table instead — that one is preserved.
        [runners.kubernetes.service_container_security_context]
          privileged = true

  tags: "build-image"

securityContext:
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  privileged: true
  capabilities:
    drop: []
  
persistentVolumes:
  enabled: false

persistentVolumeClaims:
  enabled: false
# =============================================================================
# Prometheus Metrics
# =============================================================================
metrics:
  enabled: true
  podMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: kube-prometheus-stack
