## The ubuntu runner image uses a different UID: switch securityContext with it.
image:
  registry: registry.gitlab.com
  image: gitlab-org/gitlab-runner
  # tag: alpine-v{{.Chart.AppVersion}}

replicas: 2

revisionHistoryLimit: 5

gitlabUrl: http://gitlab.example.com/

runnerToken: "<GITLAB_RUNNER_TOKEN>"

## Lowered from 10 to 5 (2026-05-08) to relieve etcd/apiserver write pressure under CI bursts.
concurrent: 5

shutdown_timeout: 0

checkInterval: 3

rbac:
  create: true
  generatedServiceAccountName: ""

  rules:
    - apiGroups: ["extensions", "apps"]
      resources: ["deployments"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: [""]
      resources: ["pods","services","secrets","pods/exec", "serviceaccounts", "pods/attach"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  podSecurityPolicy:
    enabled: true
    resourceNames:
      - gitlab-runner

  imagePullSecrets: []

serviceAccount:
  create: true

runners:
  # `request_concurrency` below is a CEILING, not the limit that is actually enforced. Runner 19.x
  # also computes an adaptive request-concurrency limit and enforces the LOWER of the two, and on
  # this fleet the adaptive one measured lower — so raising the number below does not by itself
  # widen poll concurrency, and a burst can still serialize. Live figures and the full analysis sit
  # next to the GitLabRunnerConcurrentLimitReached rule in
  # observability/monitoring/kube-prometheus-stack/values/dev-alerts-apps.yaml; that alert used to
  # be justified by this setting and no longer reads the request-concurrency counter at all.
  # This note lives ABOVE `config:` on purpose: comments inside the block are literal TOML, so they
  # land in the rendered ConfigMap and every edit rolls the runner managers. Out here they are free.
  config: |
    [[runners]]
      # Ceiling only, NOT the limit actually enforced — see the note above `config:`. Kept below
      # `concurrent` (request_concurrency must not exceed the run capacity). Must sit above the
      # [runners.kubernetes] sub-table header (TOML binds keys to the last-opened table).
      request_concurrency = 3
      [runners.kubernetes]
        namespace = "{{.Release.Namespace}}"
        image = "alpine"
        # Reduce apiserver GET /pods polling frequency (default 3s) — eases control-plane load.
        poll_interval = 5
        # Tolerate transient apiserver slowdowns without failing the job (default 180s).
        poll_timeout = 600
        # Allow graceful pod termination instead of immediate delete (reduces etcd churn).
        cleanup_grace_period_seconds = 30

  tags: "build-image"

securityContext:
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  privileged: true
  capabilities:
    drop: []

persistentVolumes:
  enabled: false

persistentVolumeClaims:
  enabled: false
# =============================================================================
# Prometheus Metrics
# =============================================================================
metrics:
  enabled: true
  podMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: kube-prometheus-stack
