# Per-release ArgoCD metadata consumed by the infra-applicationset git-files generator
# (argocd-applicationset repo, appsets/onprem/infra/infra-applicationset.yaml).
# One file per helmfile release: the generator emits one Application named `infra-<releaseName>`.
#
# Phase 3-5 target — the first generator-v2 consumer (multi-valueFile + ignoreDifferences).
# Adopts the live helmfile release 'kube-prometheus-stack' (monitoring ns, chart 86.3.2) in place.
#
# Multi-valueFile: this chart splits its values across THREE files (core / alertmanager / alerts).
# The structured ApplicationSet template can only render a single valueFile, so the extra two are
# declared in `extraValueFiles` below; the appset's templatePatch re-renders the whole sources array
# with valueFiles = [valueFile] + extraValueFiles (see infra-applicationset.yaml templatePatch v2).
#
# Workload ownership (drives the adopt-diff expectation):
#   - Deployments grafana / kube-state-metrics / operator  -> instance=kube-prometheus-stack (helm-owned)
#   - DaemonSet node-exporter (7 nodes)                     -> helm-owned
#   - Prometheus & Alertmanager are CRs (helm-owned); their StatefulSets are GENERATED BY THE OPERATOR
#     (instance label = the CR name, not the helm release), so they live OUTSIDE the helm release and
#     ArgoCD adopts only the CRs — it never touches the operator-generated STS directly (same pattern
#     as the ECK elasticsearch STS). releaseName=kube-prometheus-stack keeps every helm-owned object's
#     selector/instance label identical to live -> no recreate.
#   - monitoring.coreos.com CRDs are owned by the wave_0 prometheus-operator-crds component
#     (crds.enabled=false here) -> not in this release, not adopted.
#
# ignoreDifferences (Grafana PVC volumeName) — INTENTIONALLY OMITTED, confirmed unnecessary.
# The live Grafana PVC 'kube-prometheus-stack-grafana' is Bound with volumeName=pvc-869cceb4-...
# (NFS dynamic provisioner) while a fresh chart render emits no volumeName (assigned at bind time).
# A client-side diff (helmfile) flags this as immutable drift, but this App uses ServerSideDiff=true
# (server-side apply dry-run), which preserves system/provisioner-owned fields like volumeName — the
# same mechanism that hid the operator-injected ECK webhook caBundle. VERIFIED 2026-06-29: the
# adopt-diff showed only the tracking-id annotation on this PVC (no /spec/volumeName change), so no
# ignoreDifferences is needed. Don't suppress what isn't drifting. The generator
# (infra-applicationset templatePatch v2) supports the ignoreDifferences key on demand if ever needed.
#
# autoSync:false -> enroll MANUAL first. Verify the adopt-diff (zero recreate of any Deployment/DS,
# zero change to Prometheus/Alertmanager CR spec, PVC untouched) via a manual sync, THEN flip to true.
#
# This file is the chart-version SSOT for the migrated component (upgrade.py bumps chart.version here).
component: kube-prometheus-stack                # -> app-name label on the generated App
releaseName: kube-prometheus-stack              # -> App name (infra-<releaseName>) AND helm release name (clean adoption)
namespace: monitoring                           # already helmfile-managed; do not contest ownership
syncWave: "4"                                   # observability tier (mirrors helmfile deploy wave 4)
chart:
  repoURL: https://prometheus-community.github.io/helm-charts
  name: kube-prometheus-stack
  version: "87.15.1"
# Primary values file (repo-root-relative; pulled via the kuberntes-infra $values multi-source ref).
valueFile: observability/monitoring/kube-prometheus-stack/values/dev.yaml
# Extra values files merged after the primary (generator-v2 multi-valueFile support). Order matters:
# helmfile applies dev.yaml -> dev-alertmanager.yaml -> dev-alerts.yaml; ArgoCD applies them in the
# same order (primary first, then this list), so later files win on overlapping keys — same as helmfile.
extraValueFiles:
  - observability/monitoring/kube-prometheus-stack/values/dev-alertmanager.yaml
  - observability/monitoring/kube-prometheus-stack/values/dev-alerts.yaml
createNamespace: false                          # 'monitoring' already exists
autoSync: true                                  # adopt-diff verified clean (every resource = tracking-id annotation only; zero Deployment/DaemonSet recreate, Prometheus/Alertmanager STS generation unchanged=2/2, Grafana PVC untouched) -> auto-sync (prune+selfHeal) on
# ignoreDifferences omitted on purpose — add only if the adopt-diff proves /spec/volumeName drifts
# under ServerSideDiff (see the header note). The generator supports it when the key is present.
