# yaml-language-server: $schema=
# =============================================================================
# Alertmanager — routing, inhibit rules, Slack receiver
# (Helm values override for kube-prometheus-stack, not raw AM config)
# =============================================================================
alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Ingress disabled after Phase 6 cutover (2026-04-17) — NGF owns .55. alertmanager.route(below) is sole path.
  ingress:
    enabled: false
    ingressClassName: nginx
    hosts:
      - alertmanager.example.com

  # Gateway API HTTPRoute (sole traffic path since the 2026-04-17 cutover)
  # - Only matches set → chart auto-wires backend to alertmanager Service (port 9093);
  #   additionalRules would append the chart default and render 2 rules
  route:
    main:
      enabled: true
      parentRefs:
        - name: ngf
          namespace: nginx-gateway
      hostnames:
        - alertmanager.example.com
      matches:
        - path:
            type: PathPrefix
            value: /

  alertmanagerConfiguration:
    name: ""
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      # Pod crash-looping is the root cause — suppress related pod/deployment warnings
      - source_matchers:
          - 'alertname = PodCrashLooping'
        target_matchers:
          - 'alertname = PodNotReady'
        equal:
          - 'namespace'
          - 'pod'
      - source_matchers:
          - 'alertname = PodCrashLooping'
          - 'severity = critical'
        target_matchers:
          - 'alertname = KubeDeploymentRolloutStuck'
        equal:
          - 'namespace'

      # Disk severity ladder — critical suppresses warning on same mountpoint
      - source_matchers:
          - 'alertname = DiskSpaceCritical'
        target_matchers:
          - 'alertname = DiskSpaceRunningLow'
        equal:
          - 'instance'
          - 'mountpoint'
      - source_matchers:
          - 'alertname = NodeFilesystemInodesCritical'
        target_matchers:
          - 'alertname = NodeFilesystemInodesRunningLow'
        equal:
          - 'instance'
          - 'mountpoint'

      # Cilium — agent/operator failures cause downstream endpoint/drop alerts
      - source_matchers:
          - 'alertname = CiliumAgentUnhealthy'
        target_matchers:
          - 'alertname =~ "CiliumEndpointNotReady|CiliumDropRateHigh"'
        equal:
          - 'instance'
      # CiliumOperatorDown is cluster-wide (absent() has no instance label)
      - source_matchers:
          - 'alertname = CiliumOperatorDown'
        target_matchers:
          - 'alertname =~ "CiliumEndpointNotReady|CiliumDropRateHigh|CiliumAgentUnhealthy"'

      # ArgoCD — reconcile stuck is root cause; suppress downstream app state alerts on same app.
      # Enabled only under Option A (when ArgoCDAppDegraded/Missing/OutOfSync are active).
      # See cicd/argo-cd/docs/ghost-alarm-incident-2026-04-23.md - final architecture section
      # - source_matchers:
      #     - 'alertname = ArgoCDControllerReconcileStuck'
      #   target_matchers:
      #     - 'alertname =~ "ArgoCDAppDegraded|ArgoCDAppMissing|ArgoCDAppOutOfSync"'
      #   equal:
      #     - 'name'

      # Severity ladder within the same alertname (fallback)
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack-infra-alerts'
      routes:
        # Watchdog is the dead-man's-switch heartbeat (kube-prometheus-stack's
        # default alert, always firing while Prometheus + Alertmanager are
        # healthy). It is deliberately dropped to 'null' here: a push-based
        # external receiver would require an external SaaS signup or a
        # self-hosted endpoint reachable from the cluster's egress. Instead an
        # OUT-OF-CLUSTER host cron on the bastion polls Prometheus health and
        # pages Slack on failure — the same dead-man's-switch goal with no
        # signup and no inbound exposure. See docs/external-watchdog.md.
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        - receiver: 'null'
          matchers:
            - alertname = "InfoInhibitor"
    receivers:
      - name: 'null'
      - name: 'slack-infra-alerts'
        slack_configs:
          - api_url: "https://hooks.slack.com/services/<TEAM>/<CHANNEL>/<TOKEN>"
            channel: "#infra-alerts"
            send_resolved: true
            # Three severities, three looks. Before this, `info` fell into the
            # else-branch and was indistinguishable from `warning` in both the
            # colour bar and the title emoji.
            color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else if eq .CommonLabels.severity "info" }}#439FE0{{ else }}warning{{ end }}{{ else }}good{{ end }}'
            title: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}:red_circle:{{ else if eq .CommonLabels.severity "info" }}:large_blue_circle:{{ else }}:large_yellow_circle:{{ end }} [{{ .CommonLabels.cluster }}] [{{ .CommonLabels.severity | toUpper }}] {{ .CommonLabels.alertname }}{{ else }}:white_check_mark: [{{ .CommonLabels.cluster }}] [RESOLVED] {{ .CommonLabels.alertname }}{{ end }}'
            # Layout is three blocks separated by blank lines: WHERE (labels),
            # WHAT (summary, description, runbook), then the Prometheus link.
            # When several alerts group into one notification a rule divides
            # them — without it the blocks run together and it is easy to
            # misread one alert's instance as another's.
            #
            # `{{ if $i }}` emits the divider only between alerts, never before
            # the first or after the last.
            #
            # At most 10 alerts are rendered. `group_by` carries `namespace`,
            # but node-level alerts have no namespace label, so a single disk
            # event collapses every node into one notification — DiskSpace*
            # spans dozens of instance x mountpoint series on its own.
            # Alertmanager truncates `title` at 1024 runes but sends `text`
            # whole, so past Slack's ~8000-character attachment limit Slack cuts
            # mid-alert with nothing to say it did. Ten whole alerts plus a
            # count of the rest can be read; a message that stops in the
            # middle of one cannot.
            #
            # `.Labels.env` never renders on the AWS clusters — that label is
            # attached by the on-prem additionalScrapeConfigs and exists
            # nowhere else. The branch is kept so all three cluster files stay
            # byte-identical, which C4 of `make lint-governance` enforces.
            # The leading blank line is load-bearing: Slack renders `title` and
            # `text` as one run, so without it the first field lands on the
            # title line ("... [INFO] AlertNameNamespace: foo").
            text: |-


              {{ $total := len .Alerts }}{{ $shown := .Alerts }}{{ if gt $total 10 }}{{ $shown = slice .Alerts 0 10 }}{{ end }}{{ range $i, $a := $shown }}
              {{- if $i }}
              ──────────────────────────────
              {{ end }}
              {{- if .Labels.namespace }}*Namespace:* `{{ .Labels.namespace }}`
              {{ end }}
              {{- if .Labels.pod }}*Pod:* `{{ .Labels.pod }}`
              {{ end }}
              {{- if .Labels.container }}*Container:* `{{ .Labels.container }}`
              {{ end }}
              {{- if .Labels.instance }}*Instance:* `{{ .Labels.instance }}`
              {{ end }}
              {{- if .Labels.env }}*Env:* `{{ .Labels.env }}`
              {{ end }}
              {{- if .Labels.group }}*Group:* `{{ .Labels.group }}`
              {{ end }}
              {{- if .Labels.severity }}*Severity:* `{{ .Labels.severity }}`
              {{ end }}
              {{- if .Annotations.summary }}
              *Summary:* {{ .Annotations.summary }}
              {{ end }}
              {{- if .Annotations.description }}*Description:* {{ .Annotations.description }}
              {{ end }}
              {{- if .Annotations.runbook_url }}*Runbook:* <{{ .Annotations.runbook_url }}|runbook>
              {{ end }}
              {{- if .GeneratorURL }}
              *Source:* <{{ .GeneratorURL }}|Prometheus>
              {{ end }}
              {{- end }}
              {{- if gt $total (len $shown) }}
              _Showing {{ len $shown }} of {{ $total }} alerts in this group._
              {{- end }}
    templates:
      - '/etc/alertmanager/config/*.tmpl'
