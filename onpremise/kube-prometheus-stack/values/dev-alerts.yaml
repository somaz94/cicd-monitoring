# yaml-language-server: $schema=
#
# SPLIT ACROSS FOUR FILES. `additionalPrometheusRulesMap` is a MAP, so helm deep-merges
# it across every values file and each top-level key becomes its own PrometheusRule CR --
# the file boundary has no effect at runtime, it exists so a 76K file stops being one
# reviewable unit.
#
#   dev-alerts.yaml          defaultRules.disabled + the cluster itself (node, pod, cilium,
#                            control-plane)
#   dev-alerts-network.yaml  metallb, blackbox
#   dev-alerts-apps.yaml     argocd, gitlab-runner, harbor, keycloak, sealed-secrets,
#                            elasticsearch, redis, mysql
#   dev-alerts-backup.yaml   backup (every Stale/Missing pair)
#
# 🔴 A group key must appear in EXACTLY ONE file. helm merges the map by key, so the same
# key in two files does not combine the two rule lists -- the later file replaces the
# earlier one wholesale and the dropped rules disappear silently.
#
# 🔴 A NEW FILE HERE IS NOT PICKED UP ON ITS OWN. Add it to `extraValueFiles` in
# argocd/kube-prometheus-stack.yaml; the infra-applicationset templatePatch ranges over
# that list. `make alert-lint` needs no change -- extract-alert-rules.py globs
# **/values/*.yaml.
#
# severity levels:
#   critical — immediate action required (Pod crash, disk 95%+)
#   warning  — investigate soon (high CPU/memory, disk 80%+)
#   info     — FYI only, suppressed by InfoInhibitor

defaultRules:
  # DO NOT add `additionalRuleLabels: {cluster: ...}` here. It rewrites the cluster label on the
  # built-in RECORDING rules too, and the apiserver-availability *:increase30d rules then collapse
  # historical cluster="" series into the new value over their 30d lookback -> "vector contains
  # metrics with the same labelset after applying rule labels" (PrometheusRuleFailures, critical).
  # The [cluster] Slack title prefix already comes from prometheusSpec.externalLabels — enough to
  # tell clusters apart in the shared #infra-alerts channel. The alert description body may show an
  # empty "on cluster ." (an upstream default-rule annotation quirk); that cosmetic gap is accepted.
  # (Reverted 2026-07-07 after additionalRuleLabels broke recording-rule evaluation.)
  disabled:
    # Pod lifecycle — replaced by custom PodCrashLooping (critical) / PodNotReady
    KubePodCrashLooping: true
    KubePodNotReady: true
    # Filesystem space — replaced by custom DiskSpaceRunningLow / DiskSpaceCritical
    NodeFilesystemAlmostOutOfSpace: true
    NodeFilesystemSpaceFillingUp: true
    # Filesystem inodes — replaced by custom NodeFilesystemInodesRunningLow / Critical
    NodeFilesystemAlmostOutOfFiles: true
    NodeFilesystemFilesFillingUp: true
    # Network errors — replaced by custom NodeNetworkErrors (combined RX+TX)
    NodeNetworkReceiveErrs: true
    NodeNetworkTransmitErrs: true

additionalPrometheusRulesMap:

  # K8s nodes + physical servers (via node-exporter).
  node-alerts:
    groups:
      - name: node-alerts
        rules:

          - alert: HighCPUUsage
            expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 5m
            labels:
              severity: warning
              group: node
            annotations:
              summary: "High CPU usage on {{ $labels.instance }}"
              description: "CPU usage is above 85% for 5 minutes (current: {{ $value }}%)"

          - alert: HighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 5m
            labels:
              severity: warning
              group: node
            annotations:
              summary: "High memory usage on {{ $labels.instance }}"
              description: "Memory usage is above 85% for 5 minutes (current: {{ $value }}%)"

          # The selector excludes filesystems whose fullness is not actionable.
          # tmpfs/overlay are container ephemeral storage. The rest are macOS
          # (build machine): nullfs is a Gatekeeper AppTranslocation mirror,
          # /Library/Developer holds simulator runtime disk images that are
          # read-only and sized to their contents (permanently ~97% "full"),
          # and /System/Volumes/* are APFS siblings that re-report the same
          # container as / -- six identical series, so six identical alerts.
          # None of these exist on Linux, where the selector is a no-op.
          #
          # The AWS siblings (kube-prometheus-stack-aws prod-alerts.yaml and
          # example-app-prod-alerts.yaml) deliberately keep the short selector:
          # they carry no additionalScrapeConfigs, so they only ever see
          # in-cluster targets and the macOS clauses would be dead conditions.
          # That divergence is intentional -- do not "sync" it.
          - alert: DiskSpaceRunningLow
            expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|nullfs|devfs|autofs", mountpoint!~"/System/Volumes/.*|/Library/Developer/.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|nullfs|devfs|autofs", mountpoint!~"/System/Volumes/.*|/Library/Developer/.*"})) * 100 > 80
            for: 10m
            labels:
              severity: warning
              group: node
            annotations:
              summary: "Disk space running low on {{ $labels.instance }}"
              description: "Disk usage is above 80% on {{ $labels.mountpoint }} (current: {{ $value }}%)"

          - alert: DiskSpaceCritical
            expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|nullfs|devfs|autofs", mountpoint!~"/System/Volumes/.*|/Library/Developer/.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|nullfs|devfs|autofs", mountpoint!~"/System/Volumes/.*|/Library/Developer/.*"})) * 100 > 95
            for: 5m
            labels:
              severity: critical
              group: node
            annotations:
              summary: "Disk space critical on {{ $labels.instance }}"
              description: "Disk usage is above 95% on {{ $labels.mountpoint }} (current: {{ $value }}%)"

          # Many small files can exhaust inodes even with free disk space
          - alert: NodeFilesystemInodesRunningLow
            expr: (1 - (node_filesystem_files_free{fstype!~"tmpfs|overlay|nullfs|devfs|autofs", mountpoint!~"/System/Volumes/.*|/Library/Developer/.*"} / node_filesystem_files{fstype!~"tmpfs|overlay|nullfs|devfs|autofs", mountpoint!~"/System/Volumes/.*|/Library/Developer/.*"})) * 100 > 80
            for: 10m
            labels:
              severity: warning
              group: node
            annotations:
              summary: "Filesystem inodes running low on {{ $labels.instance }}"
              description: "Inode usage is above 80% on {{ $labels.mountpoint }} (current: {{ $value }}%)"

          # Almost no inodes left — new file creation will fail
          - alert: NodeFilesystemInodesCritical
            expr: (1 - (node_filesystem_files_free{fstype!~"tmpfs|overlay|nullfs|devfs|autofs", mountpoint!~"/System/Volumes/.*|/Library/Developer/.*"} / node_filesystem_files{fstype!~"tmpfs|overlay|nullfs|devfs|autofs", mountpoint!~"/System/Volumes/.*|/Library/Developer/.*"})) * 100 > 95
            for: 5m
            labels:
              severity: critical
              group: node
            annotations:
              summary: "Filesystem inodes critical on {{ $labels.instance }}"
              description: "Inode usage is above 95% on {{ $labels.mountpoint }} (current: {{ $value }}%)"

          # Sustained network errors indicate cable, driver, or NIC problems
          - alert: NodeNetworkErrors
            expr: (rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m])) > 10
            for: 5m
            labels:
              severity: warning
              group: node
            annotations:
              summary: "Network errors detected on {{ $labels.instance }}"
              description: "Interface {{ $labels.device }} has {{ $value }} errors/sec (RX+TX combined over 5m)"

          # Indicates system is overloaded — processes are waiting for CPU
          - alert: NodeHighSystemLoad
            expr: node_load5 / count without(cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 2
            for: 10m
            labels:
              severity: warning
              group: node
            annotations:
              summary: "High system load on {{ $labels.instance }}"
              description: "5-minute load average is {{ $value }}x the number of CPUs"

          # Frequent carrier changes suggest unstable link (bad cable, switch port)
          - alert: NodeNetworkInterfaceFlapping
            expr: changes(node_network_carrier{device!~"veth.*|lxc.*|cali.*|flannel.*|cni.*"}[10m]) > 2
            for: 5m
            labels:
              severity: warning
              group: node
            annotations:
              summary: "Network interface flapping on {{ $labels.instance }}"
              description: "Interface {{ $labels.device }} changed carrier state {{ $value }} times in 10 minutes"

  # ---------------------------------------------------------------------------
  # Build machine (mac-mini) — the one failure mode nothing else can see.
  #
  # Disk usage on this host is already covered: DiskSpaceRunningLow /
  # DiskSpaceCritical above apply to every scraped node_exporter, and a dead
  # exporter is covered by the chart's default TargetDown. Neither can see a
  # missing mount, because node_exporter simply stops publishing the series.
  # ---------------------------------------------------------------------------
  build-machine-alerts:
    groups:
      - name: build-machine-alerts
        rules:
          # Jenkins build workspaces live on an external USB SSD at
          # /Volumes/ExtremeSSD (~71GB of working data). The host has no fstab
          # or autofs entry for it and relies on macOS automounting, so an
          # unplugged or failed drive takes every build down — and today that
          # is only discovered when a build fails.
          #
          # `and on() up == 1` keeps this from double-firing with TargetDown:
          # absent() is also true when the whole exporter is gone, and one
          # event should raise one alert.
          - alert: BuildMachineExternalSSDMissing
            expr: absent(node_filesystem_size_bytes{job="build-machines", mountpoint="/Volumes/ExtremeSSD"}) and on() (up{job="build-machines"} == 1)
            for: 5m
            labels:
              severity: critical
              group: build-machine
            annotations:
              summary: "Build machine external SSD is not mounted"
              description: "/Volumes/ExtremeSSD stopped reporting while the exporter is still up. Jenkins build workspaces live there, so builds will fail until it is remounted."

          # Memory pressure, expressed the way macOS actually behaves.
          #
          # HighMemoryUsage in node-alerts cannot cover this host: it reads
          # node_memory_MemAvailable_bytes / MemTotal_bytes, and darwin
          # node_exporter publishes neither. Porting its shape would be worse
          # than leaving the gap -- macOS deliberately keeps free memory near
          # zero (inactive pages are reclaimable cache), so (1 - free/total)
          # reads 88% on this host while macOS's own memory_pressure reports
          # 73% free. That rule would fire on an idle machine.
          #
          # wired + compressed is the part that genuinely cannot be reclaimed,
          # and compressed is what grows first under real pressure because
          # macOS compresses before it swaps. Measured at 25% idle, so 80%
          # leaves room for a Unity build's working set.
          #
          # Deliberately NOT alerting on swap: this host has 8GB for Unity
          # Android builds and swaps during normal builds, so a swap-rate rule
          # needs a baseline taken during an actual build before it can have a
          # threshold that is not noise.
          - alert: BuildMachineMemoryPressure
            expr: (node_memory_wired_bytes{job="build-machines"} + node_memory_compressed_bytes{job="build-machines"}) / node_memory_total_bytes{job="build-machines"} * 100 > 80
            for: 15m
            labels:
              severity: warning
              group: build-machine
            annotations:
              summary: "Memory pressure on the build machine {{ $labels.instance }}"
              description: "Unreclaimable memory (wired + compressed) is above 80% of RAM for 15 minutes (current: {{ $value }}%). Builds may start failing or thrashing swap."

  pod-alerts:
    groups:
      - name: pod-alerts
        rules:

          # kubelet sets waiting.reason=CrashLoopBackOff only after consecutive
          # restart failures, so this avoids false positives from a single restart
          # (e.g. transient liveness probe timeout under CPU pressure).
          - alert: PodCrashLooping
            expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
            for: 5m
            labels:
              severity: critical
              group: pod
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff"
              description: "Container {{ $labels.container }} has been in CrashLoopBackOff for at least 5 minutes"

          # Excludes Completed/Succeeded Pods (e.g., CronJob backup Pods) to prevent false alerts
          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="true"} == 0 unless on(namespace, pod) kube_pod_status_phase{phase=~"Succeeded|Failed"} == 1
            for: 10m
            labels:
              severity: warning
              group: pod
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
              description: "Pod has been in not-ready state for 10 minutes"

  cilium-alerts:
    groups:
      - name: cilium-alerts
        rules:

          # Non-ready endpoints cannot send or receive traffic via Cilium
          - alert: CiliumEndpointNotReady
            expr: sum by(instance) (cilium_endpoint_state{endpoint_state!="ready"}) > 0
            for: 10m
            labels:
              severity: warning
              group: cilium
            annotations:
              summary: "Cilium endpoints not ready on {{ $labels.instance }}"
              description: "{{ $value }} endpoints are in non-ready state for 10 minutes"

          # High drop rates may indicate policy misconfiguration or network issues
          - alert: CiliumDropRateHigh
            expr: sum by(instance, reason) (rate(cilium_drop_count_total[5m])) > 50
            for: 5m
            labels:
              severity: warning
              group: cilium
            annotations:
              summary: "High Cilium packet drop rate on {{ $labels.instance }}"
              description: "Cilium is dropping {{ $value }} packets/sec (reason: {{ $labels.reason }})"

          # An unhealthy agent cannot enforce network policies
          - alert: CiliumAgentUnhealthy
            expr: cilium_agent_unhealthy > 0
            for: 5m
            labels:
              severity: critical
              group: cilium
            annotations:
              summary: "Cilium agent unhealthy on {{ $labels.instance }}"
              description: "Cilium agent has been reporting unhealthy status for 5 minutes"

          # The operator manages CiliumIdentity, CiliumEndpoint CRDs and IP allocation
          - alert: CiliumOperatorDown
            expr: absent(cilium_operator_process_start_time_seconds)
            for: 5m
            labels:
              severity: critical
              group: cilium
            annotations:
              summary: "Cilium operator is down"
              description: "No Cilium operator process detected for 5 minutes — CRD management and IP allocation are halted"

          # Single cilium-agent CPU outlier vs DaemonSet peers (added 2026-05-13)
          # Catches the failure mode where a cilium pod stays ready=true but spins on a BPF
          # datapath loop (e.g. CT GC retry against an unpinned BPF map after a restart).
          # The 4 cilium_* health alerts above do NOT cover this case — agent reports healthy
          # while burning 20+ cores worth of CPU on its own node. Comparing each agent's CPU
          # to the average of its DaemonSet peers makes the outlier obvious regardless of
          # baseline (10m sustained guards against transient buildkit/datapath bursts).
          # Precedent: 2026-05-13 cilium-rnkhg on k8s-control-01 ran at 1141m vs peer avg ~50m
          # for >5min, driving the control-plane node to 74% CPU with no alert firing.
          - alert: CiliumAgentCPUOutlier
            expr: |
              rate(container_cpu_usage_seconds_total{namespace="kube-system",pod=~"cilium-.*",container="cilium-agent"}[5m])
              / ignoring(pod) group_left()
              avg(rate(container_cpu_usage_seconds_total{namespace="kube-system",pod=~"cilium-.*",container="cilium-agent"}[5m]))
              > 5
            for: 10m
            labels:
              severity: warning
              group: cilium
            annotations:
              summary: "Cilium agent {{ $labels.pod }} CPU 5x DaemonSet average"
              description: "Single cilium-agent pod CPU is 5x the average of its DaemonSet peers for 10m — likely BPF/datapath loop while still reporting ready. Check logs for repeated warnings (e.g. 'Skipping CT garbage collection'); recovery is usually `kubectl delete pod {{ $labels.pod }} -n kube-system` so the DaemonSet recreates the pod with a clean init pass. Precedent: 2026-05-13 incident on k8s-control-01."

  # ---------------------------------------------------------------------------
  # Control Plane Alerts — etcd / apiserver / CI-correlation from the 2026-05-08 incident.
  # Default rules cover most cases; these add the user-felt symptom and a leading CI-burst indicator.
  # ---------------------------------------------------------------------------
  control-plane-alerts:
    groups:
      - name: control-plane-alerts
        rules:

          # apiserver pods GET p99 > 2s sustained 5m — user-felt `kubectl get pods` lag.
          - alert: PodsAPIHighLatency
            expr: histogram_quantile(0.99, sum by (le, verb, scope) (rate(apiserver_request_duration_seconds_bucket{resource="pods",verb=~"GET|LIST"}[5m]))) > 2
            for: 5m
            labels:
              severity: warning
              group: control-plane
            annotations:
              summary: "Pods API {{ $labels.verb }} ({{ $labels.scope }}) p99 latency high"
              description: "apiserver pods {{ $labels.verb }} scope={{ $labels.scope }} p99 latency is {{ $value | humanizeDuration }} (>2s) for 5m. Likely cause: etcd backend pressure (check EtcdRequestSlow, GitLabRunnerPodSurge)."

          # etcd get/list p99 > 800ms sustained 15m — still more sensitive than the default 1s threshold.
          # 2026-05-12 tuned twice:
          #   - for 5m → 15m: filter intermittent VM-disk fsync spikes (WAL fsync p50 0.75ms vs p99 471ms = noisy neighbor / hypervisor pauses).
          #   - threshold 0.5s → 0.8s: env baseline sits ~700ms even with no user impact (apiserver pods GET/LIST p99 stays ~5ms), so 0.5s produced sustained false-positive.
          # Still 200ms below the default 1s → catches sustained pressure earlier than the user-felt PodsAPIHighLatency (2s, 5m).
          - alert: EtcdRequestSlow
            expr: histogram_quantile(0.99, sum by (le, operation) (rate(etcd_request_duration_seconds_bucket{operation=~"get|list"}[5m]))) > 0.8
            for: 15m
            labels:
              severity: warning
              group: control-plane
            annotations:
              summary: "etcd {{ $labels.operation }} p99 slow"
              description: "etcd {{ $labels.operation }} p99 latency is {{ $value | humanizeDuration }} (>800ms) for 15m. Cross-check etcd_disk_wal_fsync / backend_commit on the Control Plane Health dashboard."

          # gitlab-runner ns pod count > 15 sustained 3m — leading indicator of CI burst that drives etcd/apiserver latency.
          # concurrent=5 per release × 2 releases → steady-state ~10; sustained >15 means burst incoming.
          - alert: GitLabRunnerPodSurge
            expr: count(kube_pod_info{namespace="gitlab-runner"}) > 15
            for: 3m
            labels:
              severity: info
              group: control-plane
            annotations:
              summary: "GitLab Runner pod surge ({{ $value }} pods)"
              description: "gitlab-runner namespace has {{ $value }} pods (>15) for 3m+. Expected steady-state ~10. Watch for follow-up PodsAPIHighLatency / EtcdRequestSlow alerts."
