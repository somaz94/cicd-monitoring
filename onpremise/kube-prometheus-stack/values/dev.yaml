# yaml-language-server: $schema=
# =============================================================================
# kube-prometheus-stack Custom Values — base infrastructure
#
# Values are split across six files; extraValueFiles in argocd/kube-prometheus-stack.yaml
# is canonical. This file: Grafana, Prometheus, node-exporter, kube-state-metrics.
# =============================================================================

# CRD lifecycle is owned by the dedicated `prometheus-operator-crds` helmfile
# release (version-pinned to the operator appVersion), NOT this chart's bundled
# `crds` subchart. Keeping this false avoids dual-ownership conflicts and lets
# the pipeline reconcile/self-heal CRDs even if they are deleted out-of-band.
crds:
  enabled: false

grafana:
  enabled: true

  # Local admin credentials come from the `grafana-auth` Secret (unsealed from the SealedSecret in
  # `extraObjects` below), NOT from an inline `adminPassword`.
  #
  # Do NOT simply delete this block to "remove the password": kube-prometheus-stack leaves
  # `adminPassword` commented out, so dropping the override falls through to the grafana subchart's
  # own default, which is the literal string `strongpassword`. Replacing it is required, not optional.
  #
  # The local admin is now BREAK-GLASS ONLY — day-to-day login is OIDC (see auth.generic_oauth in
  # grafana.ini). The login form is deliberately left enabled (`disable_login_form` unset) because
  # this component auto-syncs: a bad OIDC change reaches the cluster with no manual gate, and the
  # local admin is then the only way back in. Read the password with:
  #   kubectl -n monitoring get secret grafana-auth -o jsonpath='{.data.admin-password}' | base64 -d
  #
  # SCOPE NOTE — this moved the password OUT OF GIT; it did NOT rotate it. The sealed value is the
  # same one the cluster already had, on purpose, so git / live / this comment all agree.
  # Grafana applies `admin_password` only when it first CREATES the admin user, and that user has
  # existed since 2026-04-07, so an env change alone can never take effect here. Rotating it needs a
  # deliberate `grafana-cli admin reset-admin-password <new>` inside the pod plus a reseal — decided
  # against for now (2026-07-30). Until then this password is still the cluster-wide shared one that
  # also appears in security/vaultwarden, security/keycloak, and bootstrap/vm.
  admin:
    existingSecret: grafana-auth
    userKey: admin-user
    passwordKey: admin-password

  # OIDC client secret as an env var rather than a value in grafana.ini.
  # Grafana maps GF_<SECTION>_<KEY> onto config, so this populates
  # auth.generic_oauth.client_secret without the secret ever entering the rendered ConfigMap —
  # which also keeps the chart's `assertNoLeakedSecrets` guard (default true) satisfied.
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-auth
        key: oidc-client-secret

  grafana.ini:
    server:
      # Absolute URL Grafana builds its OAuth redirect from. Must match the Keycloak client's
      # redirectUris (https://grafana.example.com/login/generic_oauth) or the flow fails.
      root_url: https://grafana.example.com
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      client_id: grafana
      # client_secret intentionally absent — injected via envValueFrom above.
      #
      # `groups` is NOT requested here. In this realm the groups claim rides in on a DEFAULT
      # client-scope plus the client's own oidc-group-membership-mapper, so it arrives
      # automatically; asking for it explicitly makes Keycloak reject the request with
      # `Invalid scopes`. Same reason the argo-cd dex connector omits its scopes list
      # (cicd/argo-cd/values/dev.yaml).
      scopes: openid email profile
      auth_url: https://auth.example.com/realms/example/protocol/openid-connect/auth
      token_url: https://auth.example.com/realms/example/protocol/openid-connect/token
      api_url: https://auth.example.com/realms/example/protocol/openid-connect/userinfo
      # Match Harbor's `oidc_user_claim: preferred_username` so a user is `admin` here too,
      # rather than an email-shaped login that differs from every other app.
      login_attribute_path: preferred_username
      name_attribute_path: name
      # Keycloak group -> Grafana role. `full.path: "false"` on the groups mapper means the claim
      # carries bare names (`server`), not paths (`/server`).
      #   global-admin -> GrafanaAdmin  (1 member; server admin + org Admin)
      #   server       -> Admin         (the 8 GitLab `server` group members; org Admin)
      #   anything else-> Viewer
      #
      # Two distinct levels, deliberately:
      #   Admin        = ORG role. Dashboards, folders, datasources, alert rules, org users.
      #                  This is what the ops team needs; Editor stops at dashboards.
      #   GrafanaAdmin = org Admin PLUS the server-admin flag (`isAdmin`), which is the only thing
      #                  that reveals Administration → Server Admin: global users across orgs,
      #                  org create/delete, server settings, LDAP, server stats, plugin install.
      #                  Kept to `global-admin` (1 member) — the 8-member `server` group has no
      #                  need to manage orgs or server settings.
      #
      # Safe to grant broadly only because `server` stopped meaning "everyone" on 2026-07-30: the
      # Keycloak IdP mapper used to hardcode EVERY brokered GitLab user into it (43 accounts vs the
      # intended 8). See security/keycloak/docs/gitlab-brokering.md.
      role_attribute_path: contains(groups[*], 'global-admin') && 'GrafanaAdmin' || contains(groups[*], 'server') && 'Admin' || 'Viewer'
      # Required for the path above to be allowed to return GrafanaAdmin — without it Grafana
      # silently caps the result at org Admin. It also makes the flag SYNC on every login: leaving
      # `global-admin` revokes server admin on the user's next sign-in, it is not sticky.
      allow_assign_grafana_admin: true
      # auth.example.com serves a SELF-SIGNED wildcard cert (issuer == subject == CN=*.example.com),
      # and these token/userinfo calls are server-to-server from the Grafana pod, so verification
      # would fail outright. Same reason the argo-cd dex connector sets insecureSkipVerify.
      # Remove once cert-manager issues a trusted cert for *.example.com.
      tls_skip_verify_insecure: true

  # Sealed admin + OIDC client secret. `encryptedData` is safe to commit: it is encrypted with the
  # sealed-secrets controller's PUBLIC cert and only that controller's private key can open it.
  # `--scope strict` (the kubeseal default) binds the ciphertext to monitoring/grafana-auth, so
  # renaming either the namespace or the Secret makes it undecryptable — reseal instead of editing.
  #
  # Carried here rather than as a standalone manifest because this component is ArgoCD-pull managed
  # (argocd/kube-prometheus-stack.yaml, autoSync: true); shipping it inside the release means git
  # stays the single source of truth and a cluster rebuild needs no out-of-band step.
  extraObjects:
    - apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: grafana-auth
        namespace: monitoring
      spec:
        encryptedData:
          admin-user: 
          admin-password: 
          oidc-client-secret: 
        template:
          metadata:
            name: grafana-auth
            namespace: monitoring

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Ingress disabled after Phase 6 cutover (2026-04-17) — NGF owns .55. grafana.route(below) is sole path.
  ingress:
    enabled: false
    ingressClassName: nginx
    hosts:
      - grafana.example.com

  # Gateway API HTTPRoute (sole traffic path since the 2026-04-17 cutover)
  # - grafana subchart natively supports the route: block (charts/grafana/templates/route.yaml)
  # - Only matches specified → chart auto-wires backend to grafana Service (port 80)
  route:
    main:
      enabled: true
      parentRefs:
        - name: ngf
          namespace: nginx-gateway
      hostnames:
        - grafana.example.com
      matches:
        - path:
            type: PathPrefix
            value: /

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: nfs-client-server

  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Asia/Seoul

prometheus:
  # Ingress disabled after Phase 6 cutover (2026-04-17) — NGF owns .55. prometheus.route(below) is sole path.
  ingress:
    enabled: false
    ingressClassName: nginx
    hosts:
      - prometheus.example.com

  # Gateway API HTTPRoute (sole traffic path since the 2026-04-17 cutover)
  # - upstream chart natively supports the route: block (templates/prometheus/route.yaml)
  # - Only matches specified → chart auto-wires backend to prometheus Service (port 9090)
  route:
    main:
      enabled: true
      parentRefs:
        - name: ngf
          namespace: nginx-gateway
      hostnames:
        - prometheus.example.com
      matches:
        - path:
            type: PathPrefix
            value: /

  prometheusSpec:
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Stamp every alert with the source cluster — alerts share the #infra-alerts Slack
    # channel with the AWS prod cluster (kube-prometheus-stack-aws), and this label drives
    # the [example-cluster] title prefix (dev-alertmanager.yaml). externalLabels attach only
    # to alerts / remote_write, not to locally-stored series, so dashboards are unaffected.
    externalLabels:
      cluster: example-cluster

    retention: 15d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs-client-server
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Scrape external targets (physical servers, VMs)
    # Hosts run node_exporter from node-exporter/ansible/; the gitlab VM uses GitLab's bundled one.
    additionalScrapeConfigs:
      - job_name: "physical-servers"
        scrape_interval: 30s
        static_configs:
          - targets:
              - "192.0.2.10:9100"  # server1
              - "192.0.2.12:9100"  # server2
              - "192.0.2.20:9100"  # server3
              - "192.0.2.15:9100"  # server4
            labels:
              env: "physical"
              group: "on-premise"

      - job_name: "virtual-machines"
        scrape_interval: 30s
        static_configs:
          - targets:
              - "192.0.2.60:9100"  # gitlab
            labels:
              env: "vm"
              group: "on-premise"

      # Jenkins build machine (macOS). Kept as its own job rather than folded
      # into physical-servers so the alert rules can target it by job name --
      # its failure modes are specific to this host (the build workspaces live
      # on an external SSD, and its internal disk fills from build artifacts).
      - job_name: "build-machines"
        scrape_interval: 30s
        static_configs:
          - targets:
              - "192.0.2.80:9100"  # mac-mini
            labels:
              env: "physical"
              group: "on-premise"

    # Cilium metrics (no ServiceMonitor — scrape via kubernetes_sd_configs)
      - job_name: "cilium-agent"
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            regex: cilium
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: ${1}:9962

      - job_name: "cilium-operator"
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_name]
            regex: cilium-operator
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: ${1}:9963

    # Select every ServiceMonitor/PodMonitor cluster-wide, regardless of release label
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # Mount the etcd-client-cert secret into Prometheus pod for kubeEtcd ServiceMonitor mTLS scrape.
    # Created out-of-band by scripts/sync-etcd-client-cert.sh (kubespray certs on control-01).
    secrets:
      - etcd-client-cert

# kubespray external etcd on control-01 — mTLS scrape via 2379.
kubeEtcd:
  enabled: true
  # External etcd is a host systemd service, not a static pod — point endpoints at the node IP.
  endpoints:
    - 192.0.2.17
  service:
    enabled: true
    # etcd does not expose a separate metrics port (no --listen-metrics-urls); scrape the client port (2379).
    port: 2379
    targetPort: 2379
  serviceMonitor:
    enabled: true
    scheme: https
    insecureSkipVerify: false
    # Cert paths inside Prometheus pod (mounted from secret etcd-client-cert above).
    caFile: /etc/prometheus/secrets/etcd-client-cert/ca.crt
    certFile: /etc/prometheus/secrets/etcd-client-cert/client.crt
    keyFile: /etc/prometheus/secrets/etcd-client-cert/client.key

# Cilium replaces kube-proxy.
kubeProxy:
  enabled: false

# K8s nodes (DaemonSet); off-cluster hosts use node-exporter/ansible/.
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
