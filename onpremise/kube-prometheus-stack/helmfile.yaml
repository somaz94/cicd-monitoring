# Deploy kube-prometheus-stack (Prometheus + Grafana + Alertmanager + node-exporter + kube-state-metrics)
# via helmfile, consuming upstream prometheus-community chart.
# Multi-file values split: core / alertmanager / alerts.
# Chart version pinned. Bump via ./upgrade.sh after verifying the new release.

repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

releases:
  # The monitoring.coreos.com CRDs are owned by the standalone wave_0 component
  # `observability/monitoring/prometheus-operator-crds` (this chart's bundled
  # `crds` subchart is disabled via crds.enabled=false in values/dev.yaml).
  # The CRDs are cluster-wide and consumed from wave_0 onward, so they cannot
  # live inside this wave_4 component — see that component's README for the
  # ordering rationale and the 2026-06-12 outage root cause. The operator
  # appVersion below (Chart.yaml) and that component's chart appVersion are kept
  # in lockstep by scripts/ci/check-crds-lockstep.py (`make lint-governance`).
  - name: kube-prometheus-stack
    chart: prometheus-community/kube-prometheus-stack
    namespace: monitoring
    version: 86.0.0
    values:
      - values/dev.yaml               # Grafana, Prometheus, node-exporter, kube-state-metrics
      - values/dev-alertmanager.yaml  # Alertmanager routing, inhibit_rules, Slack receiver
      - values/dev-alerts.yaml        # defaultRules.disabled + custom PrometheusRule groups

# Ensure namespace before sync (idempotent no-op when present).
# kubectl args aren't shell-parsed → use sh -c to evaluate || true.
hooks:
  - events: ["presync"]
    showlogs: true
    command: "sh"
    args:
      - "-c"
      - "kubectl create namespace monitoring 2>/dev/null || true"
