---
# Fluent Bit DaemonSet — stdout collection (post-transition, single release)
# Replaces the previous NFS aggregator (single Deployment with 4 RWX PVCs
# mounted from the NFS server) with per-node stdout tailing. /var/log/containers/
# is the kubelet-managed symlink directory; this DaemonSet uses the standard
# cri parser to read CRI-formatted container output.
#
# Coverage (5 INPUTs):
#   - dev game    (ns dev-example-project)     → log_source dev-example-project-game
#   - dev battle  (ns dev-example-project)     → log_source dev-example-project-battle
#   - dev2 game   (ns dev2-example-project)    → log_source dev2-example-project-game
#   - dev2 battle (ns dev2-example-project)    → log_source dev2-example-project-battle
#   - qa game     (ns qa-example-project)      → log_source qa-example-project-game
#
# dev2 is a clone of the dev environment added 2026-09-15. Each INPUT is a
# namespace+app glob, so a new environment is NOT picked up automatically --
# adding one means an INPUT + a matching modify filter here, plus its index in
# the elasticsearch/index-retention CronJob's INDICES allow-list. Miss the
# second and the new indices grow without bound.
#
# A Kibana data view is a separate, manual step — logs reach ES without one, but
# nothing shows in Discover until it exists.
#
# Each INPUT carries its own tag and DB file so state is independent and one
# pod's tail position cannot mask another. The modify filters set the same
# log_source values the previous NFS aggregator used, so existing ES indices
# (one per log_source above) keep
# receiving — fluentd routing is unchanged. The historical stg INPUT was
# removed 2026-05-19 (staging-example-project namespace has zero pods); to bring it
# back, re-add an INPUT + modify filter and tag with example-project.stdout.stg.game.*.
#
# pino-pretty workaround retired 2026-05-22 — qa.game switched to raw NDJSON
# matching dev.game/dev.battle, so the lua strip_ansi + pino_pretty_extract
# chain was removed and example-project_json_extract consolidated back to a single
# block (Match example-project.stdout.*, Key_Name message). dev.battle still uses
# Serilog schema (Level / Timestamp / MessageTemplate) and is normalized in
# fluentd values/dev.yaml 02_filters.conf Step 2/3. History in
# docs/pino-pretty-removal-en.md.

kind: DaemonSet

image:
  repository: cr.fluentbit.io/fluent/fluent-bit
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}

rbac:
  create: true
  # nodeAccess: true enables the kubernetes filter to query the node's kubelet
  # endpoint for pod metadata enrichment (namespace, labels, annotations).
  nodeAccess: true

podSecurityContext: {}

securityContext:
  # /var/log/containers and /var/log/pods are root-owned; reading them needs
  # uid 0. fluent-bit official image runs as root by default.
  runAsUser: 0
  privileged: false

resources:
  requests:
    cpu: "50m"
    memory: "100Mi"
  limits:
    cpu: "500m"
    memory: "500Mi"

# No tolerations: tainted nodes (ci-build, control-plane) are excluded on purpose.
tolerations: []

nodeSelector: {}

affinity: {}

# fluent-bit forwards to fluentd (not ES directly) — ES credentials not needed.
env: []

# Per-node state directory for SQLite DB checkpoints + filesystem chunk buffer.
# DaemonSet uses hostPath instead of PVC: each pod owns its own node's state,
# pod restart on the same node preserves checkpoints, no RWO lock contention.
extraVolumes:
  - name: fluentbit-state
    hostPath:
      path: /var/lib/fluent-bit
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: fluentbit-state
    mountPath: /fluent-bit/state

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On
        storage.path /fluent-bit/state/storage/
        storage.sync normal
        storage.checksum off
        storage.backlog.mem_limit 50M

  inputs: |
    # Dev ExampleProject Game stdout (kubelet writes to /var/log/containers).
    [INPUT]
        Name tail
        Path /var/log/containers/dev-example-project-game-*_dev-example-project_*.log
        Path_Key filepath
        Tag example-project.stdout.dev.game.*
        # containerd splits any stdout line over 16KB into several CRI entries flagged
        # P(artial) / F(inal). `Parser cri` reads each physical line on its own and hands
        # downstream a JSON fragment nothing can recover — the record reaches ES with
        # data=null, so even fluentd's Authorization redaction is skipped. Only the
        # built-in `cri` MULTILINE parser rejoins the chain. It does the same CRI field
        # extraction, so it REPLACES `Parser cri` rather than accompanying it.
        multiline.parser cri
        # Sized for the REJOINED record, which can exceed the 32KB tail default that
        # Skip_Long_Lines enforces. Raw file lines never reach it — containerd caps those
        # at 16KB before fluent-bit reads them. Matches the prod-example-app values.
        Buffer_Chunk_Size 1M
        Buffer_Max_Size 5M
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On
        Skip_Empty_Lines On
        Refresh_Interval 10
        # Start from EOF on first apply (avoid replaying historical lines).
        # After DB populates, restarts resume from the last checkpoint
        # regardless of this flag.
        Read_from_Head false
        DB /fluent-bit/state/tail-dev-game.db
        DB.locking true
        DB.sync normal
        storage.type filesystem

    # Dev ExampleProject Battle stdout
    [INPUT]
        Name tail
        Path /var/log/containers/dev-example-project-battle-*_dev-example-project_*.log
        Path_Key filepath
        Tag example-project.stdout.dev.battle.*
        # See the dev game INPUT above — rejoin containerd's >16KB P/F line splits.
        multiline.parser cri
        Buffer_Chunk_Size 1M
        Buffer_Max_Size 5M
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On
        Skip_Empty_Lines On
        Refresh_Interval 10
        Read_from_Head false
        DB /fluent-bit/state/tail-dev-battle.db
        DB.locking true
        DB.sync normal
        storage.type filesystem

    # Dev2 ExampleProject Game stdout
    [INPUT]
        Name tail
        Path /var/log/containers/dev2-example-project-game-*_dev2-example-project_*.log
        Path_Key filepath
        Tag example-project.stdout.dev2.game.*
        # See the dev game INPUT above — rejoin containerd's >16KB P/F line splits.
        multiline.parser cri
        Buffer_Chunk_Size 1M
        Buffer_Max_Size 5M
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On
        Skip_Empty_Lines On
        Refresh_Interval 10
        Read_from_Head false
        DB /fluent-bit/state/tail-dev2-game.db
        DB.locking true
        DB.sync normal
        storage.type filesystem

    # Dev2 ExampleProject Battle stdout
    [INPUT]
        Name tail
        Path /var/log/containers/dev2-example-project-battle-*_dev2-example-project_*.log
        Path_Key filepath
        Tag example-project.stdout.dev2.battle.*
        # See the dev game INPUT above — rejoin containerd's >16KB P/F line splits.
        multiline.parser cri
        Buffer_Chunk_Size 1M
        Buffer_Max_Size 5M
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On
        Skip_Empty_Lines On
        Refresh_Interval 10
        Read_from_Head false
        DB /fluent-bit/state/tail-dev2-battle.db
        DB.locking true
        DB.sync normal
        storage.type filesystem

    # QA ExampleProject Game stdout
    [INPUT]
        Name tail
        Path /var/log/containers/qa-example-project-game-*_qa-example-project_*.log
        Path_Key filepath
        Tag example-project.stdout.qa.game.*
        # See the dev game INPUT above — rejoin containerd's >16KB P/F line splits.
        multiline.parser cri
        Buffer_Chunk_Size 1M
        Buffer_Max_Size 5M
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On
        Skip_Empty_Lines On
        Refresh_Interval 10
        Read_from_Head false
        DB /fluent-bit/state/tail-qa-game.db
        DB.locking true
        DB.sync normal
        storage.type filesystem

  filters: |
    # Enrich with Kubernetes metadata (namespace, pod, labels, annotations) for
    # every INPUT. Adds a nested "kubernetes" object — useful for Kibana
    # filtering.
    [FILTER]
        Name kubernetes
        Match example-project.stdout.*
        Merge_Log Off
        Keep_Log On
        K8S-Logging.Parser Off
        K8S-Logging.Exclude Off

    # Raw-JSON parser — every component emits valid JSON as the first character
    # of stdout: the game components are Pino NDJSON (qa.game since 2026-05-22),
    # the battle components emit a .NET structured-logging shape. Parse straight from `message` (the cri
    # parser key). The Match uses a single wildcard pattern example-project.stdout.*
    # because fluent-bit's [FILTER] Match is a single-pattern string (unlike
    # [OUTPUT] routing) — space-separated multi-patterns silently match nothing.
    # dev.battle uses a different key shape (Level / Timestamp / MessageTemplate
    # / Properties); fluentd's 02_filters.conf normalizes that to level /
    # @timestamp / message. Plain-text bootup lines (ASP.NET Core "Now
    # listening on: ...", "info: Microsoft.Hosting.Lifetime[0]") fail JSON
    # parse here and pass through unchanged — fluentd treats the raw text as
    # the message body and falls back to level=info / @timestamp=receive time.
    [FILTER]
        Name parser
        Match example-project.stdout.*
        Key_Name message
        Parser example-project_json_extract
        Reserve_Data On
        Preserve_Key Off

    # Per-component metadata: log_source drives fluentd's dynamic index name.
    [FILTER]
        Name modify
        Match example-project.stdout.dev.game.*
        Set log_source dev-example-project-game
        Set environment dev
        Set app example-project
        Set component game
        Set label game
        Set collection_path stdout

    [FILTER]
        Name modify
        Match example-project.stdout.dev.battle.*
        Set log_source dev-example-project-battle
        Set environment dev
        Set app example-project
        Set component battle
        Set label battle
        Set collection_path stdout

    [FILTER]
        Name modify
        Match example-project.stdout.dev2.game.*
        Set log_source dev2-example-project-game
        Set environment dev2
        Set app example-project
        Set component game
        Set label game
        Set collection_path stdout

    [FILTER]
        Name modify
        Match example-project.stdout.dev2.battle.*
        Set log_source dev2-example-project-battle
        Set environment dev2
        Set app example-project
        Set component battle
        Set label battle
        Set collection_path stdout

    [FILTER]
        Name modify
        Match example-project.stdout.qa.game.*
        Set log_source qa-example-project-game
        Set environment qa
        Set app example-project
        Set component game
        Set label game
        Set collection_path stdout

  outputs: |
    # Forward to fluentd (same target as the retired NFS aggregator). fluentd's
    # existing <match example-project.**> block handles Pino->Winston normalization,
    # timestamp conversion, and ES indexing — no fluentd config change required.
    [OUTPUT]
        Name forward
        Match example-project.*
        Host fluentd
        Port 24224
        Retry_Limit no_limits
        storage.total_limit_size 2G
        # Wire-format compatibility with fluentd in_forward.
        # fluent-bit >= 3.2 (chart 5.0.3+) added entry-level metadata to forward
        # events, producing [time, metadata, record] tuples that fluentd parses
        # as time=[real_time, {}] and rejects as "skip invalid event".
        # Send_options Off disables the option header; Time_as_Integer On encodes
        # time as native msgpack int — both restore the legacy [time, record].
        Send_options Off
        Time_as_Integer On

  customParsers: |
    # JSON parser for raw NDJSON payload. Used by the single example-project.stdout.*
    # branch above (Key_Name message) for all 3 components — dev.game (Pino
    # NDJSON), dev.battle (Serilog JSON), qa.game (Pino NDJSON since
    # 2026-05-22). Time parsing intentionally omitted — Pino's "time" (Unix ms
    # int) and Serilog's "Timestamp" (ISO8601 string) are both normalized in
    # fluentd's record_transformer to "@timestamp" in Asia/Seoul ISO 8601.
    [PARSER]
        Name example-project_json_extract
        Format json

logLevel: info

persistentVolumes:
  enabled: false

persistentVolumeClaims:
  enabled: false

serviceMonitor:
  enabled: true
  namespace: logging
  interval: 30s
  additionalLabels:
    release: kube-prometheus-stack
