annotations:
  artifacthub.io/changes: |-
    - kind: added
      description: "Support tpl evaluation in podAnnotations to allow dynamic checksums from parent charts."
    - kind: added
      description: "Add variantVersion value to specify the version of the variant to use."
    - kind: added
      description: "Add topologySpreadConstraints value to spread pods across zones or nodes."
    - kind: changed
      description: "Use SemVer for chart versioning (remove v prefix from appVersion)."
    - kind: changed
      description: "Update Fluentd app version to 1.19.2."
    - kind: changed
      description: "Update elasticsearch7 variant version to 1.6."
    - kind: changed
      description: "Update Fluentd app version to 1.19.3."
    - kind: changed
      description: "Update elasticsearch7 variant version to 1.1."
    - kind: fixed
      description: "Fix test connection pod to actually run so CI can pass."
    - kind: fixed
      description: "Don't render spec.replicas on the Deployment when autoscaling.enabled is true or replicaCount is unset, so the HorizontalPodAutoscaler owns the replica count."
