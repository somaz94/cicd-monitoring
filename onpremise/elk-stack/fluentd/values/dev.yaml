fileConfigs:
  01_sources.conf: |-
    <system>
      log_level info
    </system>
    
    # Input from Fluent Bit
    #
    # 🔴 Do NOT add a `tag` parameter here. in_forward's `tag` REPLACES the
    # incoming tag rather than prefixing it (add_tag_prefix is the prefix knob).
    # This config carried `tag example-project.*` from 2026-05-04 to 2026-09-15, which
    # flattened every record to that one literal tag: the catch-all
    # `example-project.**` filters and the ES output still matched, so nothing looked
    # broken, but every tag-SPECIFIC pattern silently matched nothing. The
    # per-component filter in 02_filters.conf had therefore never run once since
    # the day it was added. fluent-bit's tags (example-project.stdout.<env>.<component>.*)
    # now reach the filters intact.
    <source>
      @type forward
      port 24224
      bind 0.0.0.0
    </source>

    # Prometheus metrics
    <source>
      @type prometheus
      bind 0.0.0.0
      port 24231
      metrics_path /metrics
    </source>

    <source>
      @type prometheus_monitor
      <labels>
        host ${hostname}
      </labels>
    </source>

    <source>
      @type prometheus_output_monitor
      <labels>
        host ${hostname}
      </labels>
    </source>

  02_filters.conf: |-
    # Step 1: Fallback JSON parsing
    # Fallback for when fluent-bit's example-project_json parser fails
    #
    # 🔴 DO NOT change key_name to `message`. It was tried on 2026-08-06 (with
    # remove_key_name_field true) on the theory that `log` is a key nothing in this
    # pipeline produces, so the net never fires. That is true, but the replacement
    # STRIPPED `data` off every record within minutes of rolling out on the prod-example-app
    # twin — 100% of documents landed with data=null — and had to be reverted. `log` is
    # inert and harmless; `message` is actively destructive here. Re-derive the whole
    # filter (and test it outside a live cluster) before touching this again.
    <filter example-project.**>
      @type parser
      key_name log
      reserve_data true
      reserve_time true
      <parse>
        @type json
      </parse>
      emit_invalid_record_to_error false
    </filter>

    # Step 2: Pino / Serilog / ZLogger → Winston normalization
    # Four input shapes converge on (level / message / label):
    #   - Pino (Node.js):   level is Integer (10/20/30/40/50/60), msg is the body
    #   - Serilog (.NET):   Level is capital-L String ("Information"/"Warning"/...),
    #                       MessageTemplate is the body
    #   - ZLogger (.NET):   LogLevel is capital-LL String (Microsoft.Extensions.Logging
    #                       enum: "Information"/"Warning"/"Critical"/...),
    #                       Message is the already-rendered body
    #   - Plain text (ASP.NET Core bootup, fluent-bit JSON-parse miss): no keyspace
    #                       present → level="info", message=raw text
    # Serilog "Fatal" and ZLogger "Critical" both map to fluentd "fatal".
    <filter example-project.**>
      @type record_transformer
      enable_ruby true
      <record>
        level ${if record["level"].is_a?(Integer); {10=>"trace",20=>"debug",30=>"info",40=>"warn",50=>"error",60=>"fatal"}[record["level"]] || "info"; elsif record["Level"].is_a?(String); {"Verbose"=>"trace","Debug"=>"debug","Information"=>"info","Warning"=>"warn","Error"=>"error","Fatal"=>"fatal"}[record["Level"]] || record["Level"].downcase; elsif record["LogLevel"].is_a?(String); {"Trace"=>"trace","Debug"=>"debug","Information"=>"info","Warning"=>"warn","Error"=>"error","Critical"=>"fatal","None"=>"info"}[record["LogLevel"]] || record["LogLevel"].downcase; else; record["level"] || "info"; end}
        message ${m = record["msg"] || record["message"] || record["MessageTemplate"] || record["Message"] || ""; m.is_a?(String) ? m.gsub(/[\x00-\x1f\x7f]/, '') : m.to_s}
        label ${record["label"] || "unknown"}
      </record>
    </filter>

    # Step 3: Timestamp normalization + cleanup of unnecessary fields
    # Source-of-truth precedence:
    #   - Pino:    time (Unix ms Integer) → Asia/Seoul ISO8601
    #   - Serilog: Timestamp (ISO8601 String w/ offset) → Asia/Seoul ISO8601
    #   - ZLogger: Timestamp (ISO8601 String w/ offset, same capital-T shape as
    #              Serilog) → handled by the same branch
    #   - generic timestamp / @timestamp already present → keep
    #   - fallback → receive time (Asia/Seoul ISO8601)
    # Serilog/ZLogger parse is wrapped in `rescue` so a malformed Timestamp
    # falls back to the raw string instead of breaking the filter chain.
    <filter example-project.**>
      @type record_transformer
      enable_ruby true
      <record>
        @timestamp ${if record["time"].is_a?(Integer); t = Time.at(record["time"]/1000.0); t.localtime("+09:00").strftime("%Y-%m-%dT%H:%M:%S.%3N%:z"); elsif record["Timestamp"]; (Time.iso8601(record["Timestamp"]).localtime("+09:00").strftime("%Y-%m-%dT%H:%M:%S.%3N%:z") rescue record["Timestamp"]); elsif record["timestamp"]; record["timestamp"]; elsif record["@timestamp"]; record["@timestamp"]; else; Time.now.localtime("+09:00").strftime("%Y-%m-%dT%H:%M:%S.%3N%:z"); end}
      </record>
      # Drop original keys we already promoted to canonical names. ZLogger's
      # LogLevel / Message are normalized to level / message in Step 2 above.
      # Category (ZLogger class name) and Properties (Serilog free-form payload)
      # are intentionally preserved — useful for Kibana filtering and picked up
      # by ES dynamic mapping under the dev-example-project-battle index.
      remove_keys time,msg,filepath,req,log,Timestamp,Level,MessageTemplate,LogLevel,Message
    </filter>

    # Step 4: Handle nested JSON inside the data field
    # Convert requestBody, responseBody, requestHeader to JSON strings (compatible with ES text mapping),
    # and redact the requestHeader Authorization credential on the way through.
    # Ported from the AWS prod pipeline (fluentd-aws/values/prod.yaml, shipped
    # 2026-07-31); the expression is byte-identical, only the tag differs.
    # The value is `Basic base64(accountId:sessionId)` — a live credential, since
    # the game server authenticates by comparing that sessionId against the Redis
    # session (example-project apps/game/src/auth/strategy/basic.strategy.ts). Both the
    # dev and qa game pipelines carry it; the battle pipeline does not. The scheme
    # token (Basic / Bearer / Digest / Negotiate) is preserved so auth-scheme drift
    # stays debuggable; anything not matching a known scheme is redacted whole, so
    # an unrecognized format fails closed. Header lookup is case-insensitive —
    # Pino emits lowercase `authorization`, but another client may not.
    # Value shapes are handled exactly as before this filter grew the redaction
    # step: a Hash is serialized, a String is re-serialized only when it parses
    # (and left verbatim when it does not), and anything else — notably a native
    # Array — is passed through untouched. Only `requestHeader` gains the masking
    # pass. `to_json` is guarded because a raise here drops the whole record via
    # emit_error_event, and there is no `<label @ERROR>` to catch it; the fallback
    # must NOT be the pre-masking original, which would resurrect the credential.
    <filter example-project.**>
      @type record_transformer
      enable_ruby true
      <record>
        data ${d = record["data"]; d = (JSON.parse(d) rescue d) if d.is_a?(String); if d.is_a?(Hash); ["requestBody", "responseBody", "requestHeader"].each do |k| ; v = d.dig(k); next unless v.is_a?(Hash) || v.is_a?(String); v = (JSON.parse(v) rescue nil) if v.is_a?(String); next if v.nil?; if k == "requestHeader" && v.is_a?(Hash); v.keys.each do |hk| ; next unless hk.to_s.downcase == "authorization"; m = v[hk].to_s.match(/\A(Basic|Bearer|Digest|Negotiate)\s+\S/i); v[hk] = m ? m[1] + " [REDACTED]" : "[REDACTED]"; end; end; d[k] = (v.to_json rescue "[UNSERIALIZABLE]"); end; end; d}
      </record>
    </filter>

    # Step 5: Unescape \n in stack array
    <filter example-project.**>
      @type record_transformer
      enable_ruby true
      <record>
        stack ${s = record["stack"]; s.is_a?(Array) ? s.map do |l| l.to_s.gsub('\\n', "\n").gsub('\\"', '"') end : s rescue s}
      </record>
    </filter>

    # Step 5.5: ZLogger placeholder-key normalization (dev.battle only)
    # ZLogger emits message-template placeholders using the caller-argument
    # expression as the property key (e.g. ZLogInformation(
    # $"http: requestBody={JsonSerializer.Serialize(requestBody)}") produces a
    # property named literally "JsonSerializer.Serialize(requestBody)"). The
    # resulting ES field names contain dots / parens / spaces and exceed the
    # default keyword ignore_above (256B), landing in _ignored.
    #
    # This filter renames the known expression keys to canonical names and
    # removes the originals. When a new expression key appears in stdout,
    # register it here — otherwise ES dynamic mapping will keep absorbing
    # arbitrary expression-shaped fields. Match scope is the battle tags only
    # because the game components (Pino) do not have this issue.
    #
    # This is the ONLY tag-specific pattern in this file — every other filter is
    # the catch-all example-project.** and the output derives its index from
    # ${log_source}. It went dead from 2026-05-22 to 2026-09-15 because the
    # in_forward source flattened every tag (see 01_sources.conf); it works again
    # now. The environment part is a single-part wildcard so every battle
    # environment is covered and a new one needs no change here.
    #
    # 🟡 The battle app has emitted the canonical keys directly since the ZLogger
    # migration, so this filter currently finds nothing to rename. It is kept as
    # the safety net for a regression, not as a load-bearing step.
    <filter example-project.stdout.*.battle.**>
      @type record_transformer
      enable_ruby true
      <record>
        requestPath ${record["requestPath ?? string.Empty"] || record["requestPath"]}
        requestBody ${record["JsonSerializer.Serialize(requestBody)"] || record["requestBody"]}
        responseBody ${record["JsonSerializer.Serialize(responseBody)"] || record["responseBody"]}
      </record>
      remove_keys $['requestPath ?? string.Empty'],$['JsonSerializer.Serialize(requestBody)'],$['JsonSerializer.Serialize(responseBody)']
    </filter>

    # Step 6: ES dedup key (id_key)
    # Lift record["data"]["traceId"] to top-level _doc_id so the ES output's
    # id_key can find it (fluent-plugin-elasticsearch's id_key does not resolve
    # nested dot-paths). When data.traceId is absent (startup/lifecycle logs,
    # ~20% of game records), _doc_id is nil → ES output falls back to random
    # _id (no dedup for that subset; acceptable since those records are rare
    # and bounded by pod restart frequency).
    <filter example-project.**>
      @type record_transformer
      enable_ruby true
      <record>
        _doc_id ${record["data"].is_a?(Hash) ? record["data"]["traceId"] : nil}
      </record>
    </filter>

    # NOTE: data.traceId is kept here, and in prod too. The AWS prod pipeline
    # (fluentd-aws/values/prod.yaml) briefly ran a Step 7 that deleted the field
    # after this filter — the value also survives as the document _id, and dropping
    # it saved ~87 B/doc against 400k docs/day. That was reverted 2026-08-05:
    # _id has no .keyword sub-field and no fielddata, so terms aggregations and
    # wildcard / prefix searches on traceId became impossible — and those are the
    # queries the field exists for. It is a UUID the app issues per request and
    # shares with the battle server, so one request can be followed across both.
    # On-prem the case for dropping it was always weaker still: the whole
    # dev-example-project-game index is ~281 MB and is not ILM-managed at all, so there
    # was no saving to chase in the first place.

  03_outputs.conf: |-
    # Output to Elasticsearch with dynamic index based on log_source
    <match example-project.**>
      @type elasticsearch
      host "#{ENV['FLUENT_ELASTICSEARCH_HOST']}"
      port "#{ENV['FLUENT_ELASTICSEARCH_PORT']}" 
      user "#{ENV['FLUENT_ELASTICSEARCH_USER']}"
      password "#{ENV['FLUENT_ELASTICSEARCH_PASSWORD']}"
      scheme "#{ENV['FLUENT_ELASTICSEARCH_SCHEME']}"
      ssl_verify "#{ENV['FLUENT_ELASTICSEARCH_SSL_VERIFY']}"
      ssl_version TLSv1_2
      
      # Dynamic index name based on log_source field
      index_name ${log_source}
      type_name _doc
      suppress_type_name true

      # Deterministic _id from data.traceId (set by 02_filters Step 6).
      # Idempotent re-ingestion (backfill / replay / fluent-bit restart with
      # stale offsets) overwrites instead of duplicating. When _doc_id is nil
      # the plugin falls back to random _id (no dedup for that record).
      id_key _doc_id
      remove_keys _doc_id

      # Buffer settings for performance
      #
      # Chunk key is log_source ONLY — deliberately not `tag`. fluent-bit's tail
      # tag ends in the log FILE PATH, so it is unique per pod and changes on
      # every rollout and log rotation. Keying chunks on it would turn a handful
      # of steady chunks into one per pod-file, each with its own flush timer and
      # its own small bulk request. `tag` was in this list while the source above
      # flattened every tag to one literal value, which hid the problem; removing
      # that flattening (2026-09-15) makes the distinction real. Nothing in this
      # output references ${tag} — the index comes from ${log_source} — so the
      # chunk key is purely a batching choice.
      <buffer log_source>
        @type file
        path /var/log/fluent/elasticsearch-buffers
        flush_mode interval
        flush_interval 10s
        flush_thread_count 4
        chunk_limit_size 16MB
        # chunk count cap matches disk cap: 128 × 16MB = 2GB
        queue_limit_length 128
        retry_type exponential_backoff
        retry_wait 1s
        # Retry forever to align with fluent-bit Retry_Limit no_limits
        retry_forever true
        # Block input on overflow so backpressure pushes back to fluent-bit storage
        overflow_action block
        total_limit_size 4GB
        flush_at_shutdown true
      </buffer>

      # Performance settings
      bulk_message_request_threshold 1024

      # Safety net for unrecoverable records; retry_forever keeps recoverable ones in the primary buffer
      <secondary>
        @type file
        path /var/log/failed-records
        <format>
          @type json
        </format>
      </secondary>
    </match>

  # Suppress upstream chart 0.5.3 defaults that would otherwise leak dead routes
  # into the fluentd ConfigMap. The upstream `fileConfigs` ships a four-file chain —
  # `01_sources.conf` (host /var/log/containers/*.log tail) → `02_filters.conf`
  # (`@KUBERNETES` block) → `03_dispatch.conf` (`@DISPATCH` prometheus filter + relabel
  # to `@OUTPUT`) → `04_outputs.conf` (`@OUTPUT` → `elasticsearch-master:9200`).
  # We override 01 + 02 above with our own fluent-bit-forward + example-project.** pipeline,
  # and add 03_outputs.conf pointing at the ECK service (`elasticsearch-es-http`).
  # But 03_dispatch.conf + 04_outputs.conf are different keys, so Helm dict-merge
  # keeps the upstream defaults — `@OUTPUT` plugin still initializes against the
  # now-deleted `elasticsearch-master` service, exposing `fluentd_output_status_emit_records
  # {type="elasticsearch"} = 0` and firing `FluentdIngestStalled` (PromQL `rate(... == 0)`)
  # as a false positive. Empty-string overrides below emit an empty ConfigMap entry
  # for each, which fluentd treats as a no-op.
  03_dispatch.conf: ""
  04_outputs.conf: ""

resources:
  requests:
    cpu: "200m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

rbac:
  create: true

