# Per-release ArgoCD metadata consumed by the infra-applicationset git-files generator
# (argocd-applicationset repo, appsets/onprem/infra/infra-applicationset.yaml).
# The generator emits one Application named `infra-<releaseName>`.
#
# Phase 3-4 target. Adopts the live helmfile release 'elasticsearch' (logging ns) in place. This is an
# OCI chart (oci://ghcr.io/somaz94/charts/elasticsearch-eck) — the registered repo Secret
# 'somaz94-charts-oci-repo' and the AppProject sourceRepos entry 'ghcr.io/somaz94/charts' already
# exist (created in Phase 2 for unity-mcp-server / ghost), so no repo/AppProject change is needed.
#
# Stateful, but via ECK: the chart renders an Elasticsearch CR (+ ConfigMap / Secret / HTTPRoute /
# BackendTLSPolicy). The ECK operator owns the real StatefulSet 'elasticsearch-es-default' and the
# data PVC 'elasticsearch-data-elasticsearch-es-default-0' (30Gi) — those are NOT in the helm release,
# so ArgoCD never touches them. Adoption only annotates the chart resources; the ES CR spec must render
# IDENTICAL (same chart 0.1.9 + values) so the operator does not roll the ES pod. Verify in adopt-diff.
#
# OCI repoURL is no-scheme (ArgoCD appends chart name); matches the ghost/unity pattern. This file is
# the chart-version SSOT for the migrated component (upgrade.py bumps chart.version here).
component: elasticsearch                        # -> app-name label on the generated App
releaseName: elasticsearch                      # -> App name (infra-<releaseName>) AND helm release name (clean adoption)
namespace: logging                              # already helmfile-managed; do not contest ownership
syncWave: "4"                                   # observability tier (mirrors helmfile deploy wave 4)
chart:
  repoURL: ghcr.io/somaz94/charts               # registered OCI repo (no scheme) -> ArgoCD appends chart name
  name: elasticsearch-eck
  version: "0.1.12"
valueFile: observability/logging/elasticsearch/values/dev.yaml  # repo-root-relative; pulled via the kuberntes-infra $values multi-source ref
createNamespace: false                          # 'logging' already exists
autoSync: true                                  # adopt-diff verified (CR cpu 1000m==1 normalized by operator, zero ES roll; Secret/HTTPRoute tracking-id only) -> auto-sync (prune+selfHeal) on
