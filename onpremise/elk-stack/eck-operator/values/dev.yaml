---
# ECK Operator watches ALL namespaces (empty list).
#
# This began as a workaround for an ECK 3.3.x bug: the stackconfigpolicy-controller
# enqueued zero-value reconcile requests, so a narrowed managedNamespaces produced a
# "Reconciler error: unable to get: / because of unknown namespace for the cache"
# every ~17 minutes. That bug is FIXED upstream (elastic/cloud-on-k8s issue #9178,
# PR #9179, shipped in ECK 3.4.0), so the empty list is no longer forced.
#
# It is kept empty deliberately. Narrowing buys nothing measurable here -- every
# Elastic CR lives in 'logging' on both clusters -- while a static list silently
# stops managing any CR created elsewhere later. If scoping is ever wanted, prefer
# the namespaceSelector field (label-based; on/off-boards live, no operator restart)
# over a static list. Cluster-scoped RBAC comes from createClusterScopedResources
# below.
installCRDs: true
managedNamespaces: []

# Cluster-scoped resources are still required so the operator can watch CRDs
# and manage the webhook/ValidatingWebhookConfiguration.
createClusterScopedResources: true

# Resource limits follow upstream defaults (1 CPU, 1Gi memory).
# Operator may spike during reconcile; do NOT lower memory below 1Gi unless
# you have confirmed low-memory behavior in your environment.
resources:
  requests:
    cpu: "100m"
    memory: "150Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

# ServiceMonitor for kube-prometheus-stack. Created in the operator's release
# namespace (elastic-system); discovered automatically because Prometheus has
# serviceMonitorNamespaceSelector: {} and serviceMonitorSelector: {}.
serviceMonitor:
  enabled: true
  insecureSkipVerify: true

# Keep operator logs at info; bump to "1" or higher for debug output.
# Valid values: -2 (errors), -1 (errors+warn), 0 (info, default), >0 (debug).
#
# Metrics: secureMode (TLS + RBAC) is enabled so the chart's ServiceMonitor is
# wired correctly. The operator auto-issues a self-signed cert for :8080, and
# kube-prometheus-stack scrapes it with insecureSkipVerify=true (cluster-local
# traffic). Requires createClusterScopedResources: true (already set below) for
# the /metrics nonResourceURL ClusterRole.
config:
  logVerbosity: "0"
  metrics:
    port: "8080"
    secureMode:
      enabled: true
