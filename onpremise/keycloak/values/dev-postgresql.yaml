# Keycloak-dedicated PostgreSQL on the dev (example dev) cluster.
# Consumed by the helmfile release `keycloak-postgresql` (oci://ghcr.io/somaz94/charts/postgresql;
# the version is pinned in helmfile.yaml).
# Service hostname: `keycloak-postgresql.keycloak.svc` — referenced from values/dev-keycloak.yaml `keycloak.db.host`.

# Force the Deployment / Service / PVC name so the Keycloak CR can hard-code db.host without depending on Helm release name.
fullnameOverride: keycloak-postgresql

# postgres image — pinned to PostgreSQL 17 (latest officially supported by Keycloak 26.x at https://www.keycloak.org/server/db).
# Chart default is 18-alpine which works (JDBC compatible) but is not on the Keycloak supported matrix.
# alpine variant: ~80MB image, musl libc. Sufficient for Keycloak's UTF-8 user data.
image:
  repository: postgres
  tag: "17-alpine"

# Persistence on NFS — same storageClass as other components in this cluster.
persistence:
  enabled: true
  storageClass: nfs-client-server
  accessModes:
    - ReadWriteOnce
  size: 20Gi

# Chart-managed credential Secret. The chart renders a Secret named `keycloak-postgresql` (= fullname) holding the credentials below.
# secretKeys override changes the keys inside the Secret from POSTGRES_USER / POSTGRES_PASSWORD to username / password.
# Why: Keycloak CR's default secret key names are `username` / `password`. Sharing the same Secret with matching keys lets the Keycloak CR reference it directly via existingSecret — no external manifest needed.
# Container env names (POSTGRES_USER / POSTGRES_PASSWORD) stay the same — only the secretKeyRef.key lookup changes.
auth:
  user: keycloak
  password: exampleAdminPassword
  database: keycloak
  secretKeys:
    user: username
    password: password

# Service is internal-only (Keycloak server pod connects via cluster DNS).
service:
  type: ClusterIP
  port: 5432

# Resource sizing — small Keycloak workload (~hundreds of users, dev cluster).
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Daily pg_dump CronJob. Same 03:00 KST slot the other data components use
# (mysql, vaultwarden, ghost), so a backup window failure shows up together.
#
# Why this matters more here than for the other components: Keycloak is the IdP
# the whole platform federates through — ArgoCD, the example-hub portal and the
# seven apps behind it. Losing the realm locks the recovery tooling out along
# with everything else, because keycloak-ops itself sits behind that same login.
#
# The dump lands on a SEPARATE PVC (`keycloak-postgresql-backup`, mounted at
# /backup-data in the CronJob pod), not inside the database PVC. scripts/restore.sh
# reads it from there — see docs/backup-restore.md.
backup:
  enabled: true
  # KST 03:00 = UTC 18:00
  schedule: "0 18 * * *"
  retentionDays: 30
  # 3 matches every other backup CronJob in this cluster. Job history is only the
  # log trail, not the backup itself — the dumps keep their own 30-day retention
  # (retentionDays above), so a shorter Job history costs no recoverability.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  persistence:
    enabled: true
    storageClass: nfs-client-server
    accessModes:
      - ReadWriteOnce
    size: 20Gi
