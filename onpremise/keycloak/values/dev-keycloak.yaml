# Keycloak CR + HTTPRoute on the dev (example dev) cluster.
# Consumed by the helmfile release `keycloak` (oci://ghcr.io/somaz94/charts/keycloak-cr;
# the version is pinned in helmfile.yaml).
# Operator + CRDs must already be installed via ../keycloak-operator/.

# Keycloak CR — primary resource.
keycloak:
  # Single instance for dev (dev cluster, no HA). HA opt-in requires distributed cache config — out of scope.
  instances: 1

  # Hostname for client redirects + admin console. Required when proxy.headers != "" to avoid admin redirect loops.
  hostname:
    hostname: auth.example.com
    strict: true

  # NGF terminates TLS at the gateway. Keycloak runs HTTP only behind NGF.
  proxy:
    headers: xforwarded

  http:
    httpEnabled: true

  # DB connection — references the Secret rendered by the keycloak-postgresql release (= chart fullname `keycloak-postgresql`).
  # Keys default to username / password — matches the secretKeys override in dev-postgresql.yaml.
  db:
    vendor: postgres
    host: keycloak-postgresql.keycloak.svc
    database: keycloak
    existingSecret: keycloak-postgresql

  # Resources for the Keycloak server Pods (operator-spawned StatefulSet).
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

  # Expose /metrics on the management port (9000, already published by keycloak-service).
  # The operator gates ServiceMonitor creation on this flag — without it the Keycloak CR
  # reports `warning: A ServiceMonitor will not be created because 'metrics-enabled' is not
  # true.` and Prometheus has no Keycloak target at all. Setting it makes the operator render
  # the ServiceMonitor itself, so nothing is declared here; the Prometheus CR runs
  # serviceMonitorSelector: {} so no discovery label is required.
  #
  # Changing this rewrites the StatefulSet pod spec — the operator does a rolling restart, and
  # with instances: 1 that is a short auth outage for every service brokered through
  # auth.example.com. Apply it during a quiet window.
  additionalOptions:
    - name: metrics-enabled
      value: "true"

# Realm import — disabled at first apply. Phase 3 (UI / kcadm.sh) creates the `example` realm with GitLab brokering, then exports it back into manifests/realm-example.json and re-applies via helmfile `--set-file realmImport.realm=manifests/realm-example.json`.
realmImport:
  enabled: false

# HTTPRoute attached to NGF `ngf` Gateway https listener (wildcard-example-tls).
# Same pattern as cicd/argo-cd, security/vaultwarden, ghost.
httproute:
  enabled: true
  parentRefs:
    - name: ngf
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - auth.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - port: 8080                 # name defaults to "<release>-service"

  # Companion HTTPRoute that 301-redirects HTTP → HTTPS on the http listener.
  httpsRedirect:
    enabled: true
    statusCode: 301
    parentRefs:
      - name: ngf
        namespace: nginx-gateway
        sectionName: http
