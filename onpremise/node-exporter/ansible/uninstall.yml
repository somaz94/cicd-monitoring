---
# =============================================================================
# Node Exporter Uninstall Playbook
#
# Removes node_exporter from target hosts (stops service, removes binary, user).
#
# Usage:
#   ansible-playbook -i inventory.ini uninstall.yml                    # Uninstall all
#   ansible-playbook -i inventory.ini uninstall.yml --limit server1    # Single server
#   ansible-playbook -i inventory.ini uninstall.yml --check            # Dry-run
# =============================================================================

- name: Uninstall node_exporter
  hosts: node_exporter
  become: true

  # Variables are defined in group_vars/all.yml (single source of truth).

  tasks:
    - name: Check if node_exporter service exists
      stat:
        path: "{{ node_exporter_launchd_plist if ansible_facts.system == 'Darwin' else node_exporter_systemd_unit }}"
      register: service_file

    - name: Stop node_exporter service
      systemd:
        name: "{{ node_exporter_service }}"
        state: stopped
        enabled: false
      when:
        - ansible_facts.system != 'Darwin'
        - service_file.stat.exists
      ignore_errors: true

    - name: Unload node_exporter LaunchDaemon
      command: "launchctl bootout system/{{ node_exporter_launchd_label }}"
      register: launchd_bootout
      changed_when: launchd_bootout.rc == 0
      failed_when: false
      when:
        - ansible_facts.system == 'Darwin'
        - service_file.stat.exists

    - name: Remove service unit file
      file:
        path: "{{ node_exporter_launchd_plist if ansible_facts.system == 'Darwin' else node_exporter_systemd_unit }}"
        state: absent

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true
      when: ansible_facts.system != 'Darwin'

    - name: Remove node_exporter binary
      file:
        path: "{{ node_exporter_bin }}"
        state: absent

    - name: Remove node_exporter backup binary
      file:
        path: "{{ node_exporter_bin }}.bak"
        state: absent

    # Only the launchd path writes this; systemd hosts log to the journal.
    - name: Remove launchd log file
      file:
        path: "{{ node_exporter_launchd_log }}"
        state: absent
      when: ansible_facts.system == 'Darwin'

    # Only Linux ever created a dedicated account; on macOS the exporter ran as
    # an existing login that must survive the uninstall.
    - name: Remove node_exporter system user
      user:
        name: node_exporter
        state: absent
        remove: true
      when: ansible_facts.system != 'Darwin'

    - name: Verify node_exporter is not running
      shell: "{{ node_exporter_port_check_cmd }} || true"
      register: port_check
      changed_when: false

    - name: Display result
      debug:
        msg: >-
          {{ 'node_exporter removed from ' + inventory_hostname + ' (' + ansible_host + ')'
          if port_check.stdout | length == 0
          else 'WARNING: Port 9100 still in use on ' + inventory_hostname }}
