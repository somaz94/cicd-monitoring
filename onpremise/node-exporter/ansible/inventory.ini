# =============================================================================
# Node Exporter Target Servers
# Add new servers to the appropriate group and run the playbook to deploy.
# =============================================================================

[physical_servers]
server1 ansible_host=192.0.2.10
server2 ansible_host=192.0.2.12
server3 ansible_host=192.0.2.20
server4 ansible_host=192.0.2.15

[virtual_machines]

# =============================================================================
# Build machines (macOS)
#
# The exporter is a launchd LaunchDaemon here, not a systemd unit. macOS cannot
# create the dedicated nologin account the Linux hosts use, so this group
# overrides the run user with the existing unprivileged login
# (see group_vars/build_machines.yml).
# =============================================================================
[build_machines]
mac-mini ansible_host=192.0.2.80

[node_exporter:children]
physical_servers
virtual_machines
build_machines

[node_exporter:vars]
ansible_user=example
ansible_ssh_private_key_file=~/.ssh/id_rsa_example
ansible_become=yes
ansible_become_method=sudo
