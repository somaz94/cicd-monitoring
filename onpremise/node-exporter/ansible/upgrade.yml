---
# =============================================================================
# Node Exporter Upgrade Playbook
#
# Stops, swaps and restarts node_exporter (brief scrape gap); auto-rolls back on failure.
# Backs up current binary before replacing.
#
# Usage:
#   ansible-playbook -i inventory.ini upgrade.yml                                    # Upgrade to version in vars
#   ansible-playbook -i inventory.ini upgrade.yml -e "node_exporter_version=1.12.0"  # Upgrade to specific version
#   ansible-playbook -i inventory.ini upgrade.yml --check                            # Dry-run
#   ansible-playbook -i inventory.ini upgrade.yml --limit server1                    # Upgrade single server
# =============================================================================

- name: Upgrade node_exporter
  hosts: node_exporter
  become: true

  # Variables are defined in group_vars/all.yml (single source of truth).
  # Override per-run with: -e "node_exporter_version=1.12.0"

  tasks:
    - name: Check if port {{ node_exporter_port }} is already in use
      shell: "{{ node_exporter_port_check_cmd }} || true"
      register: port_check
      changed_when: false

    - name: Fail if port {{ node_exporter_port }} is in use by another process
      fail:
        msg: |
          Port {{ node_exporter_port }} is already in use on {{ inventory_hostname }} ({{ ansible_host }}).
          Process: {{ port_check.stdout }}
          Please free the port or change node_exporter_port variable.
      when:
        - port_check.stdout | length > 0
        - "'node_exporter' not in port_check.stdout"

    - name: Verify node_exporter service is running before upgrade
      systemd:
        name: node_exporter
      register: service_status
      failed_when: false
      when: ansible_facts.system != 'Darwin'

    - name: Verify node_exporter LaunchDaemon is loaded before upgrade
      command: "launchctl print system/{{ node_exporter_launchd_label }}"
      register: launchd_status
      changed_when: false
      failed_when: false
      when: ansible_facts.system == 'Darwin'

    # Jinja `and` short-circuits, so the systemd fact is only dereferenced on
    # the branch where the systemd task actually ran.
    - name: Warn if service is not running
      debug:
        msg: "WARNING: node_exporter is not currently running on {{ inventory_hostname }}. Proceeding with upgrade anyway."
      when: >-
        (ansible_facts.system != 'Darwin'
         and service_status.status.ActiveState | default('inactive') != 'active')
        or (ansible_facts.system == 'Darwin'
            and launchd_status.rc | default(1) != 0)

    - name: Get current node_exporter version
      command: "{{ node_exporter_bin }} --version"
      register: current_version
      changed_when: false
      failed_when: false

    - name: Display current version
      debug:
        msg: "Current: {{ current_version.stdout_lines[0] | default('not installed') }} → Target: v{{ node_exporter_version }}"

    - name: Download node_exporter v{{ node_exporter_version }}
      get_url:
        url: "{{ node_exporter_url }}"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        mode: "0644"

    - name: Extract node_exporter
      unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        dest: /tmp
        remote_src: true
      when: ansible_facts.system != 'Darwin'

    # See playbook.yml: macOS bsdtar is rejected by the unarchive module.
    - name: Extract node_exporter (bsdtar)
      command: "tar -xzf /tmp/node_exporter-{{ node_exporter_version }}.tar.gz -C /tmp"
      args:
        creates: "/tmp/{{ node_exporter_dist }}/node_exporter"
      when: ansible_facts.system == 'Darwin'

    - name: Backup current binary
      copy:
        src: "{{ node_exporter_bin }}"
        dest: "{{ node_exporter_bin }}.bak"
        remote_src: true
        mode: "0755"
      when: current_version.rc == 0

    - name: Upgrade with auto-rollback on failure
      block:
        - name: Stop node_exporter
          systemd:
            name: node_exporter
            state: stopped
          when: ansible_facts.system != 'Darwin'

        - name: Unload node_exporter LaunchDaemon
          command: "launchctl bootout system/{{ node_exporter_launchd_label }}"
          register: launchd_bootout
          changed_when: launchd_bootout.rc == 0
          failed_when: false
          when: ansible_facts.system == 'Darwin'

        - name: Install new binary
          copy:
            src: "/tmp/{{ node_exporter_dist }}/node_exporter"
            dest: "{{ node_exporter_bin }}"
            owner: "{{ node_exporter_run_user }}"
            group: "{{ node_exporter_run_group }}"
            mode: "0755"
            remote_src: true

        - name: Start node_exporter
          systemd:
            name: node_exporter
            state: started
            daemon_reload: true
          when: ansible_facts.system != 'Darwin'

        - name: Load node_exporter LaunchDaemon
          command: "launchctl bootstrap system {{ node_exporter_launchd_plist }}"
          register: launchd_bootstrap
          changed_when: launchd_bootstrap.rc == 0
          when: ansible_facts.system == 'Darwin'

        - name: Wait for node_exporter to respond
          uri:
            url: "http://localhost:{{ node_exporter_port }}/metrics"
            return_content: false
            status_code: 200
          register: result
          retries: 3
          delay: 2
          until: result.status == 200

      rescue:
        - name: "[ROLLBACK] Restoring previous binary"
          copy:
            src: "{{ node_exporter_bin }}.bak"
            dest: "{{ node_exporter_bin }}"
            remote_src: true
            owner: "{{ node_exporter_run_user }}"
            group: "{{ node_exporter_run_group }}"
            mode: "0755"
          when: current_version.rc == 0

        - name: "[ROLLBACK] Restarting node_exporter with previous version"
          systemd:
            name: node_exporter
            state: restarted
            daemon_reload: true
          when: ansible_facts.system != 'Darwin'

        # The block unloads the daemon before swapping the binary, so by the time
        # the rescue runs there is no loaded job to kickstart — it has to be
        # bootstrapped back. The leading bootout covers the case where the
        # failure happened after a successful re-load.
        - name: "[ROLLBACK] Restarting node_exporter LaunchDaemon with previous version"
          shell: |
            launchctl bootout system/{{ node_exporter_launchd_label }} 2>/dev/null || true
            launchctl bootstrap system {{ node_exporter_launchd_plist }}
          register: launchd_rollback
          changed_when: launchd_rollback.rc == 0
          failed_when: false
          when: ansible_facts.system == 'Darwin'

        - name: "[ROLLBACK] Upgrade failed"
          fail:
            msg: "Upgrade failed on {{ inventory_hostname }} ({{ ansible_host }}). Rolled back to previous version."

    # Outside the rescue scope: a display failure here must not trigger a rollback.
    - name: Get new version
      command: "{{ node_exporter_bin }} --version"
      register: new_version
      changed_when: false
      failed_when: false

    - name: Display upgrade result
      debug:
        msg: "Upgraded {{ inventory_hostname }} ({{ ansible_host }}) → {{ new_version.stdout_lines[0] | default('unknown') }}"

    - name: Cleanup temp files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        - "/tmp/{{ node_exporter_dist }}"
