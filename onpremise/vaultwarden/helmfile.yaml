# Deploy Vaultwarden (Bitwarden-compatible password manager) via helmfile.
# Consume upstream guerzon/vaultwarden chart.
# Chart version pinned. Bump via ./upgrade.sh after verifying the new release.

repositories:
  - name: guerzon
    url: https://guerzon.github.io/vaultwarden

# Cap helm release history at 3 (helm's default is 10). Each release Secret stores the
# full rendered manifest, so 10 revisions of a large chart make helm's history query
# return several MB in a single response and the kube-apiserver stream aborts
# ("stream error INTERNAL_ERROR" on EKS / "read: operation timed out" on-prem), which
# breaks helmfile diff/apply entirely. 3 revisions still allows rollback.
# See cicd/argo-cd/docs/helm-release-history-bloat.md.
helmDefaults:
  historyMax: 3

releases:
  - name: vaultwarden
    chart: guerzon/vaultwarden
    namespace: vaultwarden
    version: 0.43.1
    values:
      - values/dev.yaml

# Ensure namespace before sync (idempotent no-op when present).
# kubectl args aren't shell-parsed → use sh -c to evaluate || true.
hooks:
  - events: ["presync"]
    showlogs: true
    command: "sh"
    args:
      - "-c"
      - "kubectl create namespace vaultwarden 2>/dev/null || true"
