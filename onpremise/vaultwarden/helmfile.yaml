# Deploy Vaultwarden (Bitwarden-compatible password manager) via helmfile.
# Consume upstream guerzon/vaultwarden chart.
# Chart version pinned. Bump via ./upgrade.py after verifying the new release.

repositories:
  - name: guerzon
    url: https://guerzon.github.io/vaultwarden

# historyMax 3: 10 revisions of a large chart overflow helm's history query on the
# apiserver stream and break helmfile diff/apply. See cicd/argo-cd/docs/helm-release-history-bloat.md.
helmDefaults:
  historyMax: 3

releases:
  - name: vaultwarden
    chart: guerzon/vaultwarden
    namespace: vaultwarden
    version: 0.46.0
    values:
      - values/dev.yaml

# Ensure namespace before sync (idempotent no-op when present).
# kubectl args aren't shell-parsed → use sh -c to evaluate || true.
hooks:
  - events: ["presync"]
    showlogs: true
    command: "sh"
    args:
      - "-c"
      - "kubectl create namespace vaultwarden 2>/dev/null || true"
