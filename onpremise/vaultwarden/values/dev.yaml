# Vaultwarden (guerzon/vaultwarden chart): server, SQLite, backup CronJob.

# DOMAIN env var — use https:// with self-signed certificate
domain: "https://vault.example.com"

fullnameOverride: "vaultwarden"

# Keycloak SSO cutover was tried twice on 2026-04-29 and rolled back (root cause: a vaultwarden 1.35.x
# reqwest/h2 client race after ALPN h2). The retry kit and full post-mortem were removed; recover them with
# `git show 6fe1396:security/vaultwarden/values/dev.yaml`, and re-verify on the current image before reusing.

# Admin portal: https://vault.example.com/admin (plain-text token below; argon2 hashes also accepted).
adminToken:
  value: "exampleAdminPassword"

# =============================================================================
# SSO — GitLab OpenID Connect (active, post Phase 5 retry rollback 2026-04-29)
# =============================================================================
# Active config: GitLab direct OIDC (Keycloak cutover rolled back 2026-04-29; see the note at the top).
#
# Original setup steps:
#   1. GitLab Admin → Applications → New Application
#      - Name: Vaultwarden
#      - Redirect URI: https://vault.example.com/identity/connect/oidc-signin
#      - Confidential: Yes
#      - Scopes: openid, email, profile
#   2. Copy Application ID → clientId.value
#   3. Copy Secret → clientSecret.value
# =============================================================================
sso:
  enabled: true
  authority: "http://gitlab.example.com"
  scopes: "openid email profile"
  signupsMatchEmail: true
  ignoreEmailVerification: true
  pkce: true
  clientId:
    value: "<GITLAB_CLIENT_ID>"
  clientSecret:
    value: "<GITLAB_CLIENT_SECRET>"

database:
  type: "default"

# Features & convenience
webVaultEnabled: "true"
allowSignups: true
signupsVerify: "false"
showPassHint: false
allowInvitation: true
invitationsAllowed: true
invitationExpirationHours: "120"
emergencyAccessAllowed: true
requireDeviceEmail: "false"
orgGroupsEnabled: "true"
orgEventsEnabled: "true"
adminRateLimitSeconds: "60"
adminRateLimitMaxBurst: "10"

storage:
  data:
    name: "vaultwarden-data"
    size: "25Gi"
    class: "nfs-client"
    path: "/data"
    keepPvc: true
    accessMode: "ReadWriteOnce"

service:
  type: ClusterIP
  port: 80

# Disabled since the NGF cutover (2026-04-17); ingress-nginx is in network/_optional.
ingress:
  enabled: false
  class: "nginx"
  nginxIngressAnnotations: true
  additionalAnnotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hostname: "vault.example.com"
  path: /
  pathType: Prefix

# ── HTTPS with cert-manager + Let's Encrypt (alternative) ──
# Prerequisites:
#   1. Install cert-manager: https://cert-manager.io/docs/installation/
#   2. Create ClusterIssuer (e.g., cloudflare-issuer)
# Ref: https://github.com/dani-garcia/vaultwarden/wiki/Enabling-HTTPS
#
# ingress:
#   additionalAnnotations:
#     cert-manager.io/cluster-issuer: "cloudflare-issuer"
#   tlsSecret: "vaultwarden-tls"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: true

# Backup CronJob (via extraObjects)
#
# Backup Strategy:
#   - CronJob runs daily at KST 03:00 (UTC 18:00)
#   - Date-stamped files: db-YYYYMMDD.sqlite3, rsa_key-YYYYMMDD.pem
#   - `sqlite3 VACUUM INTO` (NOT cp) + PRAGMA integrity_check at write time
#   - Retention: 30 days (older backups auto-deleted)
#   - Both PVCs mounted readWrite — a WAL database cannot be opened read-only
#
# Restore: ./scripts/restore.sh [YYYYMMDD|latest]
extraObjects:
  # Note: 2026-04-17 self-signed `vaultwarden-tls` Secret removed (unused after Phase 6 cutover).
  # HTTPS termination is handled by `wildcard-example-tls` on NGF ngf Gateway (nginx-gateway ns).
  # If re-introduction is needed: see Git history or `network/nginx-gateway-fabric/docs/tls-wildcard-setup.md`.

  # Backup PVC
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: vaultwarden-backup-data
      namespace: vaultwarden
      annotations:
        nfs.io/storage-path: "vaultwarden-backup-data"
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: "nfs-client"
      resources:
        requests:
          storage: 25Gi

  # Backup CronJob — date-stamped with retention
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: vaultwarden-backup
      namespace: vaultwarden
    spec:
      # KST 03:00 = UTC 18:00
      schedule: "0 18 * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: OnFailure
              containers:
                - name: backup
                  # alpine (not busybox) because the backup needs the sqlite3 CLI.
                  image: alpine:3.21
                  command: ["sh", "-c"]
                  args:
                    - |
                      set -e
                      DATE=$(date +%Y%m%d)
                      BACKUP_DIR="/backup-data"
                      RETENTION_DAYS=30
                      DEST="$BACKUP_DIR/db-${DATE}.sqlite3"
                      TMP="${DEST}.tmp"

                      echo "[$(date)] Starting backup..."

                      # sqlite3 is not in the base image. The package is tiny and this
                      # namespace has no egress NetworkPolicy. If the fetch fails the Job
                      # fails loudly, which VaultwardenBackupStale/Missing then surfaces —
                      # strictly better than the silent wrong backup this replaced.
                      apk add --no-cache sqlite >/dev/null

                      # A plain `cp` of the main DB is NOT a backup here.
                      #
                      # vaultwarden runs SQLite in WAL mode, so committed transactions sit in
                      # db.sqlite3-wal until a checkpoint folds them into db.sqlite3. The WAL
                      # stays far below the 1000-page auto-checkpoint threshold, so that
                      # checkpoint effectively never happens: on 2026-08-10 the main DB had
                      # not changed since 2026-07-13 while the WAL was 8 days newer, and all
                      # 32 retained backups were byte-identical to that same 2026-07-13
                      # snapshot. Every backup silently captured nothing.
                      #
                      # VACUUM INTO takes a read transaction and writes a consistent,
                      # self-contained copy that already includes the WAL contents.
                      #
                      # This is also why /data is now mounted read-write: opening a WAL
                      # database requires the -shm shared-memory index, which cannot be
                      # created or locked on a read-only mount. The command only reads.
                      rm -f "$TMP"
                      sqlite3 /data/db.sqlite3 "VACUUM INTO '$TMP'"

                      # Verify at write time. Without this a damaged backup is discovered at
                      # restore time — the one moment it can no longer be fixed.
                      RESULT=$(sqlite3 "$TMP" "PRAGMA integrity_check;")
                      if [ "$RESULT" != "ok" ]; then
                        echo "[$(date)] ERROR: integrity_check failed: $RESULT"
                        rm -f "$TMP"
                        exit 1
                      fi

                      # Rename last, so a partial or failed write never appears under the
                      # dated name that restore.sh picks up.
                      mv "$TMP" "$DEST"
                      cp /data/rsa_key.pem "$BACKUP_DIR/rsa_key-${DATE}.pem" 2>/dev/null || true
                      echo "[$(date)] Backup created and verified: db-${DATE}.sqlite3 ($(wc -c < "$DEST") bytes)"

                      # Retention: delete backups older than N days
                      DELETED=$(find "$BACKUP_DIR" -name "db-*.sqlite3" -mtime +${RETENTION_DAYS} -delete -print | wc -l)
                      find "$BACKUP_DIR" -name "rsa_key-*.pem" -mtime +${RETENTION_DAYS} -delete
                      # Sweep stale temp files from an interrupted run.
                      find "$BACKUP_DIR" -name "db-*.sqlite3.tmp" -mtime +1 -delete
                      echo "[$(date)] Retention: deleted ${DELETED} backups older than ${RETENTION_DAYS} days"

                      # List current backups
                      echo ""
                      echo "Available backups:"
                      ls -lh "$BACKUP_DIR"/db-*.sqlite3 2>/dev/null || echo "  (none)"
                      echo ""
                      echo "[$(date)] Backup complete."
                  volumeMounts:
                    - name: data
                      mountPath: /data
                      # Read-write is required: a WAL database cannot be opened without
                      # write access to its -shm index. See the VACUUM INTO note above.
                      readOnly: false
                    - name: backup
                      mountPath: /backup-data
              volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: vaultwarden-data-vaultwarden-0
                - name: backup
                  persistentVolumeClaim:
                    claimName: vaultwarden-backup-data

  # Gateway API HTTPRoute — sole traffic path since the Phase 6 cutover (2026-04-17).
  # ingress-nginx annotations map to the timeouts / redirect / policies below; limit-connections was dropped (no NGF equivalent).
  # Not the chart's native httpRoute: it renders one route (no redirect sibling, no NGF policies) and,
  # with fullnameOverride=vaultwarden, would collide with the `vaultwarden` route below.

  # Main HTTPRoute — attached to HTTPS listener (uses wildcard-example-tls).
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: vaultwarden
      namespace: vaultwarden
    spec:
      parentRefs:
        - name: ngf
          namespace: nginx-gateway
          sectionName: https
      hostnames:
        - vault.example.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          timeouts:
            request: 1800s
            backendRequest: 1800s
          backendRefs:
            - name: vaultwarden
              port: 80

  # Sibling HTTPRoute — HTTP→HTTPS 301 redirect
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: vaultwarden-https-redirect
      namespace: vaultwarden
    spec:
      parentRefs:
        - name: ngf
          namespace: nginx-gateway
          sectionName: http
      hostnames:
        - vault.example.com
      rules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                statusCode: 301

  # ClientSettingsPolicy — allow large body for attachments etc.
  - apiVersion: gateway.nginx.org/v1alpha1
    kind: ClientSettingsPolicy
    metadata:
      name: vaultwarden
      namespace: vaultwarden
    spec:
      targetRef:
        group: gateway.networking.k8s.io
        kind: HTTPRoute
        name: vaultwarden
      body:
        maxSize: "1024m"

  # RateLimitPolicy — per-IP request frequency limit.
  - apiVersion: gateway.nginx.org/v1alpha1
    kind: RateLimitPolicy
    metadata:
      name: vaultwarden
      namespace: vaultwarden
    spec:
      targetRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: vaultwarden
      rateLimit:
        rejectCode: 429
        local:
          rules:
            - key: $binary_remote_addr
              rate: 15r/s
              burst: 30
              zoneSize: 10m
