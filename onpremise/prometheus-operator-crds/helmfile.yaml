# Deploy prometheus-operator-crds (the monitoring.coreos.com CRD foundation)
# via helmfile, consuming the upstream prometheus-community chart.
#
# WHY THIS IS A STANDALONE wave_0 COMPONENT (not bundled in kube-prometheus-stack):
#   The monitoring.coreos.com CRDs (ServiceMonitor / PodMonitor / PrometheusRule /
#   Prometheus / Alertmanager / ScrapeConfig / Probe / ...) are CLUSTER-SCOPED and
#   consumed by many components across every category — metallb (wave_0),
#   nginx-gateway-fabric / argo-cd / harbor (wave_1), valkey (wave_3),
#   eck-operator / fluent-bit / fluentd / the exporters (wave_4), ghost (wave_5).
#   Several create their CRs in EARLIER waves than kube-prometheus-stack (wave_4),
#   so the CRDs must exist FIRST — hence this component sits at the top of wave_0.
#   Bundling the CRDs inside the stack's `crds` subchart caused the 2026-06-12
#   Prometheus outage: when the CRDs were deleted out-of-band nothing reconciled
#   them, and the stack's own chicken-and-egg (it needs the CRDs present to even
#   render its Prometheus/Alertmanager CRs) blocked self-heal.
#
# Chart version pinned. Bump via ./upgrade.py after verifying the new release.
# LOCKSTEP: the chart appVersion must not trail kube-prometheus-stack's operator
# appVersion — scripts/ci/check-crds-lockstep.py (`make lint-governance`) fails when it does.
# Decided 2026-09-30: bump this release FIRST, in its own MR, to the CRD chart matching the operator
# you are about to take, and click wave_0 before merging kube-prometheus-stack (README, LOCKSTEP).

repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

# historyMax 3: 10 revisions of a large chart overflow helm's history query on the
# apiserver stream and break helmfile diff/apply. See cicd/argo-cd/docs/helm-release-history-bloat.md.
helmDefaults:
  historyMax: 3

releases:
  - name: prometheus-operator-crds
    chart: prometheus-community/prometheus-operator-crds
    namespace: monitoring
    version: 32.0.1  # lockstep-appversion-match: observability/monitoring/kube-prometheus-stack
