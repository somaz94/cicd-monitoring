# Keycloak Operator install via somaz94/helm-charts OCI chart.
# Operator only; the actual Keycloak instance is provisioned by the sibling ../keycloak/ component.
# Chart version pinned. Bump via ./upgrade.sh (external-oci template).
# Cap helm release history at 3 (helm's default is 10). Each release Secret stores the
# full rendered manifest, so 10 revisions of a large chart make helm's history query
# return several MB in a single response and the kube-apiserver stream aborts
# ("stream error INTERNAL_ERROR" on EKS / "read: operation timed out" on-prem), which
# breaks helmfile diff/apply entirely. 3 revisions still allows rollback.
# See cicd/argo-cd/docs/helm-release-history-bloat.md.
helmDefaults:
  historyMax: 3

releases:
  - name: keycloak-operator
    namespace: keycloak-system
    chart: oci://ghcr.io/somaz94/charts/keycloak-operator
    version: "0.2.0"
    values:
      - values/dev.yaml

# Ensure target namespace exists before sync (idempotent no-op when present).
# kubectl args do not get shell-interpreted, so sh -c is required for `|| true` to work.
hooks:
  - events: ["presync"]
    showlogs: true
    command: "sh"
    args:
      - "-c"
      - "kubectl create namespace keycloak-system 2>/dev/null || true"
