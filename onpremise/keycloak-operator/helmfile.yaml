# Keycloak Operator install via somaz94/helm-charts OCI chart.
# Operator only; the actual Keycloak instance is provisioned by the sibling ../keycloak/ component.
# Chart version pinned. Bump via ./upgrade.py (external-oci template).
# historyMax 3: 10 revisions of a large chart overflow helm's history query on the
# apiserver stream and break helmfile diff/apply. See cicd/argo-cd/docs/helm-release-history-bloat.md.
helmDefaults:
  historyMax: 3

releases:
  - name: keycloak-operator
    namespace: keycloak-system
    chart: oci://ghcr.io/somaz94/charts/keycloak-operator
    version: "0.2.4"
    values:
      - values/dev.yaml
