global:
  # -- Default domain used by all components
  ## Used for ingresses, certificates, SSO, notifications, etc.
  domain: argocd.example.com
  # Pin networkPolicy.create to false (chart 10.0.0 flipped the default false -> true).
  # Preserves the pre-10.0 behavior (no bundled NetworkPolicies); adopt NP separately
  # as a deliberate change once the CNI enforcement + UI/webhook/SSO traffic is verified.
  networkPolicy:
    create: false

configs:
  cm:
    # Polling interval for discovering new manifests in the repo. Two different "defaults" get
    # quoted for this key: ArgoCD's own built-in 180s, and the argo-cd chart's 120s. Only the
    # chart's applies here — it always writes this key into argocd-cm, so the built-in never
    # takes effect. Pinned explicitly rather than omitted, because values.yaml is
    # auto-managed by upgrade.py and a chart upgrade could otherwise move this silently.
    # NOT a per-sync deadline — that is controller.repo.server.timeout.seconds below.
    #
    # This is the FALLBACK path, not the primary one. GitLab push webhooks post to /api/webhook
    # (shared secret in configs.secret.gitlabSecret below) and refresh the affected apps in ~1s,
    # covering every app sourced from server/argocd-applicationset and
    # server/kuberntes-infra. Polling only needs to catch what a missed webhook would drop
    # (GitLab down, network blip, argocd-server restarting mid-push), so a long interval is the
    # right choice: 600s plus the chart's 60s jitter bounds that worst case at ~11min.
    #
    # Sized by measurement, not feel. At 120s this cluster issued ~2.33 git requests/min to
    # GitLab (91% of them ls-remote answering "no change"), about 3.4k/day, against an actual
    # push volume of ~13/day across both repos. Polling faster than the webhook buys nothing and
    # just widens that ratio. History: 60s until 2025-10-15, then 600s with no recorded
    # rationale, briefly 120s on 2026-08-05 while no webhook existed, back to 600s once the
    # webhook was verified. Do NOT lower this without first confirming the webhook is healthy —
    # a silently broken webhook is exactly what this interval is here to cover.
    timeout.reconciliation: 600s
    timeout.hard.reconciliation: 0s
    # Resource tracking via the argocd.argoproj.io/tracking-id annotation instead of the default
    # app.kubernetes.io/instance label. Required before adopting helmfile-deployed infra components
    # into ArgoCD (app-of-apps migration): the default label tracking rewrites instance labels that
    # many charts use in immutable Deployment/StatefulSet selectors, forcing a recreate (downtime).
    # Annotation tracking leaves selector labels untouched -> zero-downtime adoption. Existing
    # example-project/secondary-project apps re-track via annotation on next sync (no resource churn).
    application.resourceTrackingMethod: annotation
    # Custom health for the single-node ECK Elasticsearch (logging/elasticsearch). A single-node ES
    # cluster is permanently `yellow` (replica shards can't be assigned with one node), which ArgoCD's
    # bundled health check maps to Progressing forever — cosmetic, but it never settles to Healthy.
    # The override is SCOPED by namespace/name to THIS ES only: any other / multi-node Elasticsearch
    # keeps the standard green=Healthy / yellow=Progressing / red=Degraded mapping. Display-only — does
    # not affect sync, prune, or the operator. Added when logging/elasticsearch was adopted into ArgoCD.
    resource.customizations.health.elasticsearch.k8s.elastic.co_Elasticsearch: |
      local hs = {}
      local singleNode = obj.metadata.namespace == "logging" and obj.metadata.name == "elasticsearch"
      if obj.status ~= nil and obj.status.health ~= nil then
        local h = obj.status.health
        if h == "green" then
          hs.status = "Healthy"
          hs.message = "Elasticsearch cluster status is green"
          return hs
        elseif h == "yellow" then
          if singleNode then
            hs.status = "Healthy"
            hs.message = "Elasticsearch cluster status is yellow (single-node: normal steady state)"
          else
            hs.status = "Progressing"
            hs.message = "Elasticsearch cluster status is yellow"
          end
          return hs
        elseif h == "red" then
          hs.status = "Degraded"
          hs.message = "Elasticsearch cluster status is red"
          return hs
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for Elasticsearch"
      return hs
    # Custom health for HorizontalPodAutoscaler. The bundled check (gitops-engine
    # pkg/health/health_hpa.go) ranks ScalingActive=False/FailedGetResourceMetric as Degraded, but
    # that condition is not a workload fault: the kube HPA controller sets it whenever NO replica
    # has a CPU/memory sample yet. That happens when every replica is replaced at once (a Karpenter
    # node rotation) or when metrics-server blips, and it clears by itself in seconds. On 2026-09-09
    # it took prod-example-app-battle Degraded for 17s and paged the channel -- HPA ScalingActive
    # recovered at 02:50:27Z and the app went Healthy at 02:50:29Z, one reconcile later. Reporting
    # it Progressing keeps that transient window out of the alert path.
    #
    # Every other reason upstream calls Degraded is preserved, and the real-fault scan runs FIRST
    # across all conditions, so a co-occurring metrics gap can never mask a genuine fault.
    #
    # Only FailedGetResourceMetric is downgraded, deliberately. In the kube HPA controller
    # (pkg/controller/podautoscaler/horizontal.go) that is the only reason ever written into the
    # ScalingActive CONDITION for a missing resource metric (getUnableComputeReplicaCountCondition).
    # FailedComputeMetricsReplicas is an Event reason only and never reaches a condition, so it
    # stays in the degraded set -- widening the downgrade would hide a genuinely broken metric spec
    # behind a permanent Progressing.
    #
    # A health override REPLACES the bundled check for this kind: returning nil does NOT fall back
    # to it (util/lua/lua.go turns a nil return into an empty HealthStatus), so the upstream logic
    # is reproduced in full below. The controller also runs Lua with SkipOpenLibs, so the `string`
    # library is NOT available here -- base and table operations only.
    resource.customizations.health.autoscaling_HorizontalPodAutoscaler: |
      local hs = {}
      local DEGRADED = {
        AbleToScale   = { FailedGetScale = true, FailedUpdateScale = true },
        ScalingActive = { InvalidSelector = true, FailedGetObjectMetric = true,
                          FailedGetPodsMetric = true, FailedGetExternalMetric = true,
                          FailedComputeMetricsReplicas = true },
      }
      local TRANSIENT = { ScalingActive = { FailedGetResourceMetric = true } }
      if obj.status == nil or obj.status.conditions == nil then
        hs.status = "Progressing"
        hs.message = "Waiting to Autoscale"
        return hs
      end
      -- 1) genuine faults, scanned across every condition before anything else
      for _, c in ipairs(obj.status.conditions) do
        local byType = DEGRADED[c.type]
        if byType ~= nil and byType[c.reason] then
          hs.status = "Degraded"
          hs.message = c.message or c.reason
          return hs
        end
      end
      -- 2) the transient metrics gap
      for _, c in ipairs(obj.status.conditions) do
        local byType = TRANSIENT[c.type]
        if byType ~= nil and byType[c.reason] then
          hs.status = "Progressing"
          hs.message = "HPA has no metric sample yet: " .. (c.message or c.reason)
          return hs
        end
      end
      -- 3) upstream's healthy signal
      for _, c in ipairs(obj.status.conditions) do
        if (c.type == "AbleToScale" or c.type == "ScalingLimited") and c.status == "True" then
          hs.status = "Healthy"
          hs.message = c.message or ""
          return hs
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting to Autoscale"
      return hs
    # SSO: dex -> Keycloak `example` realm (brokers GitLab). insecureSkipVerify below: the wildcard
    # cert is self-signed. Procedure: security/keycloak/docs/argocd-migration.md
    dex.config: |
      connectors:
        - type: oidc
          id: keycloak
          name: Keycloak
          config:
            issuer: https://auth.example.com/realms/example
            clientID: argocd
            clientSecret: <KEYCLOAK_CLIENT_SECRET>
            redirectURI: https://argocd.example.com/api/dex/callback
            # scopes intentionally omitted — uses dex default (openid + profile + email).
            # The `example` realm has no separate `groups` client-scope; the argocd client's
            # direct protocol-mapper (oidc-group-membership-mapper) injects the groups claim
            # into the token, so requesting it as a scope is unnecessary. Specifying scopes:
            # [openid groups] would be rejected by Keycloak (`Invalid scopes: ...` — groups
            # is unknown, openid is duplicated by dex's auto-prepend).
            insecureSkipVerify: true
            # Keycloak's default mapper config does not put groups claim into the ID token;
            # it is only returned by the userinfo endpoint → make dex hit userinfo to retrieve
            # groups. Without this, the ArgoCD JWT's groups claim becomes [], breaking
            # policy.csv `g, server, ...` matching → no permissions → infinite loading.
            getUserInfo: true
            # dex's oidc connector ignores the groups claim by default (security default).
            # When enabled, dex forwards the upstream's groups claim into the ArgoCD JWT.
            # Without this, dex shows groups=[] in logs even when the Keycloak token contains
            # groups: [server], breaking RBAC matching.
            insecureEnableGroups: true

  # Shared secret authenticating GitLab push webhooks at POST /api/webhook. The chart writes
  # this into argocd-secret as `webhook.gitlab.secret`; the same value goes in the "Secret token"
  # field of each GitLab project webhook (server/argocd-applicationset, server/kuberntes-infra).
  # Without it the endpoint accepts unauthenticated POSTs — argocd.example.com is reachable from
  # the LAN, so anyone there could force refreshes.
  # Webhook only shortens detection; polling (timeout.reconciliation above) stays as the fallback,
  # so a broken or unregistered webhook degrades to the poll interval rather than failing.
  # The argocd-webhook- prefix is deliberate: it makes the token matchable by pattern rather
  # than by literal value, so rotating it does not quietly bypass whatever redacts it downstream.
  secret:
    gitlabSecret: "<ARGOCD_GITLAB_WEBHOOK_SECRET>"

  params:
    create: true
    server.insecure: true
    # Both raised from 60s: large repos otherwise hit "Context deadline exceeded".
    server.repo.server.timeout.seconds: "180"
    controller.repo.server.timeout.seconds: "180"
    controller.status.processors: "600"
    controller.operation.processors: "300"
    controller.kubectl.parallelism.limit: "100"
    controller.sharding.algorithm: "round-robin"
    # Capped (default 0 = unlimited): unlimited risks OOMKilled repo-server pods.
    reposerver.parallelism.limit: "100"
  # SSH known hosts for Git repositories
  ## Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/#ssh-known-host-public-keys
  ssh:
    # -- Additional known hosts for private repositories
    extraHosts: |
      gitlab.example.com ssh-rsa <GITLAB_SSH_RSA_PUBLIC_KEY>
      gitlab.example.com ecdsa-sha2-nistp256 <GITLAB_SSH_ECDSA_PUBLIC_KEY>
      gitlab.example.com ssh-ed25519 <GITLAB_SSH_ED25519_PUBLIC_KEY>
  # Add RBAC settings
  rbac:
    create: true
    # Use email + groups for RBAC matching (default uses only 'sub' claim from dex)
    scopes: '[email, groups]'
    policy.csv: |
      # ── Global Admin  ──
      # Full access to all resources across all projects
      p, role:global-admin, applications, *, */*, allow
      p, role:global-admin, clusters, *, *, allow
      p, role:global-admin, repositories, *, *, allow
      p, role:global-admin, projects, *, *, allow
      p, role:global-admin, logs, get, *, allow
      p, role:global-admin, exec, create, */*, allow
      p, role:global-admin, certificates, *, *, allow
      p, role:global-admin, accounts, *, *, allow
      p, role:global-admin, gpgkeys, *, *, allow
      # Group-based, not email-based (switched 2026-07-30). The subject is the Keycloak
      # `global-admin` group, which arrives in the groups claim (mapper full.path=false, so no
      # leading slash). `scopes: '[email, groups]'` above is what makes a group subject matchable.
      #
      # Why it was an email before: the `global-admin` group had zero members, so a group subject
      # would have matched nobody. That empty group also pushed other consumers to gate on the far
      # broader `server` (example-hub gates keycloak-ops that way). Populating it via
      # GLOBAL_ADMIN_MEMBERS in security/keycloak/scripts/kcadm-bootstrap.sh unblocked this.
      #
      # Adding an admin is now a Keycloak group join — no values edit and no helmfile apply.
      g, global-admin, role:global-admin

      # ── Server Group ──
      # Common permissions for server group
      p, role:server-admin, clusters, get, *, allow
      p, role:server-admin, repositories, get, *, allow
      p, role:server-admin, certificates, get, *, allow
      p, role:server-admin, gpgkeys, get, *, allow

      # ExampleProject — full access
      p, role:server-admin, applications, *, example-project/*, allow
      p, role:server-admin, projects, get, example-project, allow
      p, role:server-admin, logs, get, example-project/*, allow
      p, role:server-admin, exec, create, example-project/*, allow

      # SecondaryProject — full access
      p, role:server-admin, applications, *, secondary-project/*, allow
      p, role:server-admin, projects, get, secondary-project, allow
      p, role:server-admin, logs, get, secondary-project/*, allow
      p, role:server-admin, exec, create, secondary-project/*, allow

      # Ignite — full access
      #
      # The ignite platform (ignite-manifests) and the apps it scaffolds. Unlike example-project
      # and secondary-project, whose Applications are generated from THIS cluster's config repo, ignite
      # generates its own — see ignite-manifests/argocd/appset.yaml.
      #
      # 🔴 The project name in the object below has to match the AppProject that the ignite
      # ApplicationSet assigns. If that ever becomes one AppProject per generated app, every
      # new app needs four more lines here — which is a cluster change in a repo ignite
      # cannot write to. Keep the AppProject shared so this block stays fixed.
      p, role:server-admin, applications, *, ignite/*, allow
      p, role:server-admin, projects, get, ignite, allow
      p, role:server-admin, logs, get, ignite/*, allow
      p, role:server-admin, exec, create, ignite/*, allow

      # ── Add new projects below ──
      # p, role:server-admin, applications, *, <project>/*, allow
      # p, role:server-admin, projects, get, <project>, allow
      # p, role:server-admin, logs, get, <project>/*, allow
      # p, role:server-admin, exec, create, <project>/*, allow

      g, server, role:server-admin
  
  # NOTE (2026-04-29 Phase 6 cutover): argo-cd chart 9.x reads only configs.secret.extra.<key> path —
  # the legacy `secrets:` block below is ignored. So dex client secret is inlined as plaintext in
  # dex.config above (same convention as the previous GitLab era). This block is unused.
  secrets:

# argocd-https-redirect: server.httproute renders a single HTTPRoute, so the HTTP->HTTPS sibling
# rides extraObjects to share the chart lifecycle (Harbor keeps its sibling in manifests/ instead).
extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd-https-redirect
      namespace: argocd
    spec:
      parentRefs:
        - name: ngf
          namespace: nginx-gateway
          sectionName: http
      hostnames:
        - argocd.example.com
      rules:
        - filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                statusCode: 301
