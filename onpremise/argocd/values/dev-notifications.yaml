## Notifications controller
notifications:
  # -- Enable notifications controller
  enabled: true

  # Values injected into every notification template as `.context.<key>`; the chart's own
  # documented extension point (values.yaml shows `region` / `environmentName`).
  #
  # 🔴 `cluster` replaces `.app.spec.destination.server` in the alert fields. This ArgoCD manages
  # exactly ONE cluster, so that field rendered the same `https://192.0.2.17:6443` in all 55
  # apps' alerts -- a column that never varies carries no information. The cluster name does, and
  # it stays right if the API endpoint ever changes.
  #
  # 🔧 2026-09-10: prod-notifications.yaml now carries this same key. When the warning that used
  # to sit here was written, that instance still RAN the example-app-test app, so its destination
  # field was genuinely dynamic and had to stay. That workload moved to the example-app-prod
  # ArgoCD on 2026-08-31; the example-app-test cluster is still REGISTERED there, but no
  # Application targets it any more, so the field had gone constant. Revert either file if a
  # cross-cluster app is ever added back to it.
  context:
    cluster: onprem-dev

  secret:
    create: true
    items:
      slack-token: "xoxb-your-slack-bot-token"
  
  notifiers:
    service.slack: |
      token: $slack-token
      username: ArgoCD
      icon: https://argo-cd.readthedocs.io/en/stable/assets/logo.png
      channel: "#argocd-alarm"
  
  templates:
    template.app-deployed: |
      message: |
        :white_check_mark: Application {{.app.metadata.name}} has been deployed successfully.
      slack:
        attachments: |
          [{
            "title": "{{ .app.metadata.name}} - Deployment Succeeded",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#18be52",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "App Health",
              "value": "{{.app.status.health.status}}",
              "short": true
            },
            {
              "title": "Namespace",
              "value": "{{.app.spec.destination.namespace}}",
              "short": true
            },
            {
              "title": "Deployed At",
              "value": "{{.app.status.operationState.finishedAt}} (UTC)",
              "short": true
            },
            {
              "title": "Cluster",
              "value": "{{.context.cluster}}",
              "short": true
            },
            {
              "title": "Details",
              "value": "<{{.context.argocdUrl}}/applications/{{.app.metadata.name}}|View in Argo CD>",
              "short": false
            }
            ]
          }]
    
    template.app-health-degraded: |
      message: |
        :red_circle: Application {{.app.metadata.name}} health has degraded.
      slack:
        attachments: |
          [{
            "title": "{{ .app.metadata.name}} - Health Degraded",
            "title_link":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#E96D76",
            "fields": [
            {
              "title": "Sync Status",
              "value": "{{.app.status.sync.status}}",
              "short": true
            },
            {
              "title": "App Health",
              "value": "{{.app.status.health.status}}",
              "short": true
            },
            {
              "title": "Namespace",
              "value": "{{.app.spec.destination.namespace}}",
              "short": true
            },
            {
              "title": "Occurred At",
              "value": "{{.app.status.health.lastTransitionTime}} (UTC)",
              "short": true
            },
            {
              "title": "Cluster",
              "value": "{{.context.cluster}}",
              "short": true
            }
            {{range $index, $c := .app.status.conditions}}
            ,{
              "title": "{{$c.type}}",
              "value": {{printf "%q" $c.message}},
              "short": false
            }
            {{end}}
            {{range $index, $r := .app.status.resources}}
            {{- if $r.health}}
            {{- if ne $r.health.status "Healthy"}}
            ,{
              "title": "{{$r.kind}}/{{$r.name}} - {{$r.health.status}}",
              "value": {{if $r.health.message}}{{printf "%q" $r.health.message}}{{else}}"(no message reported)"{{end}},
              "short": false
            }
            {{- end}}
            {{- end}}
            {{end}}
            ,{
              "title": "Details",
              "value": "<{{.context.argocdUrl}}/applications/{{.app.metadata.name}}|View in Argo CD>",
              "short": false
            }
            ]
          }]
    
    template.app-sync-failed: |
      message: |
        :x: Application {{.app.metadata.name}} sync has failed.
      slack:
