# Override the upstream chart defaults for the dev (example dev) cluster.
# Vendor reference: ../values.yaml (chart default). Diff this file with values.yaml on
# chart bumps to spot drift. Release name = "sealed-secrets", namespace = "sealed-secrets"
# (helmfile.yaml) — so the controller name kubeseal targets is also "sealed-secrets".

# Resource sizing for dev — single controller pod, light workload (a handful of
# SealedSecrets). The controller is mostly idle after the initial reconcile; do not
# starve it of memory during key generation / mass re-encryption.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Scrape the controller's metrics endpoint (the sealed-secrets-metrics Service on :8081).
# No discovery label is needed: the Prometheus CR runs serviceMonitorSelector: {} and
# serviceMonitorNamespaceSelector: {}, so every ServiceMonitor in every namespace is picked
# up. (A `release: kube-prometheus-stack` label is only required by ruleSelector and
# probeSelector — see ../../observability/monitoring/kube-prometheus-stack/values/dev.yaml.)
#
# The chart's ServiceMonitor selects on `app.kubernetes.io/component: metrics`, which the
# metrics Service already carries, and targets the port named `metrics`.
#
# prometheusRule stays off on purpose: alert rules for this cluster live only in
# observability/monitoring/kube-prometheus-stack/values/dev-alerts*.yaml (this group is in
# dev-alerts-apps.yaml). Letting the chart emit its own PrometheusRule would scatter rules
# outside that component and additionally
# require injecting the `release` label here to satisfy ruleSelector.
metrics:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: false
