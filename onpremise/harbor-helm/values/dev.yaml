# Expose: chart HTTPRoute `harbor-route`; TLS terminates at the NGF `ngf` Gateway (wildcard-example-tls).
# The redirect HTTPRoute + ClientSettingsPolicy are not chart-supported -> manifests/httproutes.yaml.
# Rollback to Ingress: recreate harbor-tls (docs/tls-setup.md), set type: ingress, restore the ingress: block below.
expose:
  type: route
  tls:
    enabled: true
    certSource: secret
    secret:
      # Not rendered in route mode (dead config). Real Secret must be recreated on rollback.
      secretName: harbor-tls
  # ingress:  # rollback only — see header
  #   hosts:
  #     core: harbor.example.com
  #   controller: default
  #   className: "nginx"
  #   annotations:
  #     nginx.ingress.kubernetes.io/force-ssl-redirect: "true"    # Force HTTP → HTTPS
  #     nginx.ingress.kubernetes.io/ssl-passthrough: "false"      # TLS termination at ingress
  #     nginx.ingress.kubernetes.io/proxy-body-size: "0"          # Allow large image pushes
  route:
    # Chart HTTPRoute name: harbor-route (helpers.tpl `harbor.route` template).
    # Path routing: /api/, /service/, /v2/, /c/ → harbor-core; `/` → harbor-portal (chart built-in).
    hosts:
      - harbor.example.com
    parentRefs:
      - name: ngf
        namespace: nginx-gateway
        sectionName: https
  clusterIP:
    name: harbor
    ports:
      httpPort: 80
      httpsPort: 443

externalURL: https://harbor.example.com

# SSO: Keycloak OIDC lives in Harbor's DB, not Helm values — apply it after helmfile with
# scripts/admin/harbor-admin.sh set-oidc (docs/oidc-setup-keycloak.md; GitLab rollback: docs/legacy/oidc-setup-gitlab.md).

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      storageClass: "nfs-client-server"
      accessMode: ReadWriteOnce
      size: 5Gi
    jobservice:
      jobLog:
        storageClass: "nfs-client-server"
        accessMode: ReadWriteOnce
        size: 1Gi
    database:
      storageClass: "nfs-client-server"
      accessMode: ReadWriteOnce
      size: 1Gi
    redis:
      storageClass: "nfs-client-server"
      accessMode: ReadWriteOnce
      size: 1Gi
    trivy:
      storageClass: "nfs-client-server"
      accessMode: ReadWriteOnce
      size: 5Gi
  imageChartStorage:
    disableredirect: false
    type: filesystem
    filesystem:
      rootdirectory: /storage

existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
harborAdminPassword: "exampleAdminPassword"

logLevel: info

enableMigrateHelmHook: false

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    additionalLabels:
      release: kube-prometheus-stack

trace:
  enabled: false

cache:
  enabled: true
  expireHours: 24


nginx:
  image:
    repository: goharbor/nginx-photon
    tag: v2.15.2
  automountServiceAccountToken: false
  replicas: 1
  revisionHistoryLimit: 10
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1

portal:
  image:
    repository: goharbor/harbor-portal
    tag: v2.15.2
  replicas: 1
  revisionHistoryLimit: 10
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1

core:
  image:
    repository: goharbor/harbor-core
    tag: v2.15.2
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1

jobservice:
  image:
    repository: goharbor/harbor-jobservice
    tag: v2.15.2
  replicas: 1
  revisionHistoryLimit: 10
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1

registry:
  registry:
    image:
      repository: goharbor/registry-photon
      tag: v2.15.2
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 1
  controller:
    image:
      repository: goharbor/harbor-registryctl
      tag: v2.15.2
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 1
  replicas: 1
  revisionHistoryLimit: 10
  upload_purging:
    enabled: true
    age: 168h
    interval: 24h
    dryrun: false

trivy:
  enabled: true
  image:
    repository: goharbor/trivy-adapter-photon
    tag: v2.15.2
  replicas: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1

database:
  type: internal
  internal:
    image:
      repository: goharbor/harbor-db
      tag: v2.15.2
    password: "exampleAdminPassword"
    shmSizeLimit: 2048Mi
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: 500m
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

redis:
  type: internal
  internal:
    image:
      # Harbor 1.19.2 renamed this image redis-photon -> valkey-photon upstream.
      # upgrade.py (external-with-image-tag) only rewrites the tag, so the
      # repository has to be tracked by hand on an upstream rename.
      repository: goharbor/valkey-photon
      tag: v2.15.2

exporter:
  image:
    repository: goharbor/harbor-exporter
    tag: v2.15.2
  replicas: 1
  revisionHistoryLimit: 10
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 1
