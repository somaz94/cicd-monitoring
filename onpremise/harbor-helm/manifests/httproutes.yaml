# Raw manifests for what the Harbor chart (expose.type: route -> HTTPRoute `harbor-route`) does not
# render: the HTTP->HTTPS redirect HTTPRoute and the unlimited-body ClientSettingsPolicy.

---
# Sibling HTTPRoute: 301 redirect from the HTTP listener to HTTPS.
# Not included in the chart-native templates → kept as raw. Replaces the previous Ingress `force-ssl-redirect: true`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-https-redirect
  namespace: harbor
spec:
  parentRefs:
    - name: ngf
      namespace: nginx-gateway
      sectionName: http
  hostnames:
    - harbor.example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# ClientSettingsPolicy: allow large docker push images (replaces the previous Ingress `proxy-body-size: "0"`).
# targetRef points to the chart-generated `harbor-route` HTTPRoute. The chart templates have no Policy → kept as raw.
# body.maxSize: "0" → unlimited (NGF maps this to nginx's client_max_body_size 0).
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: harbor-route
  namespace: harbor
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: harbor-route
  body:
    maxSize: "0"
