# Deploy Harbor (private container registry) via helmfile, consuming upstream harbor/harbor chart.
# Namespace creation handled by `createNamespace: true` on the release (G11 — no duplicate presync hook).
# Lifecycle hooks: postsync apply manifests/; preuninstall deletes it.
# Chart version pinned. Bump via ./upgrade.py after verifying the new release.

repositories:
  - name: harbor
    url: https://helm.goharbor.io

# historyMax 3: 10 revisions of a large chart overflow helm's history query on the
# apiserver stream and break helmfile diff/apply. See cicd/argo-cd/docs/helm-release-history-bloat.md.
helmDefaults:
  historyMax: 3

releases:
  - name: harbor
    namespace: harbor
    createNamespace: true
    chart: harbor/harbor
    version: 1.19.2
    values:
      - values/dev.yaml

    hooks:
      # postsync: kubectl apply manifests/ — what the chart (expose.type=route) does not render:
      # the HTTP→HTTPS redirect route, the ClientSettingsPolicy (unlimited docker push) and the
      # DB backup CronJob + PVC.
      # Note: helmfile apply skips hooks when there is no chart diff. Use helmfile sync for the first hook
      # application or when only manifests/ changes.
      - events: ["postsync"]
        showlogs: true
        command: "kubectl"
        args: ["apply", "-f", "manifests/"]

      # preuninstall: delete manifests/ (routes, policy, DB backup CronJob + PVC; the PV is Retain)
      # so no stale attachment is left on the parent Gateway.
      - events: ["preuninstall"]
        showlogs: true
        command: "bash"
        args:
          - "-c"
          - "kubectl delete -f manifests/ --ignore-not-found=true --wait=true || true"

# Pre-flight assertion: warn if no StorageClass available (Harbor needs PVC for DB + storage).
# Soft check — `|| true` keeps sync flowing even on empty cluster bootstrap.
hooks:
  - events: ["presync"]
    showlogs: true
    command: "sh"
    args:
      - "-c"
      - "kubectl get sc --no-headers 2>/dev/null || true"
